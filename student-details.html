<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Details - Music Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#29245f,#bd2863);
}

.container{
    width:95%;
    max-width:1250px;
    margin:30px auto;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.header{
    background:linear-gradient(135deg,#20205b,#47205b);
    color:white;
    padding:30px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-left{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo-circle{
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:5px 0 0;
    opacity:.9;
}

.back-btn{
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12);
    color:white;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.content{
    padding:35px;
}

.filters{
    display:grid;
    grid-template-columns:1fr 270px;
    gap:16px;
    margin-bottom:28px;
}

input,
select{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#6c63ff;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-title h2{
    margin:0;
    font-size:24px;
}

.count{
    color:#777;
}

.student-list{
    display:grid;
    gap:12px;
}

.student-card{
    border:1px solid #e5e5e5;
    border-radius:15px;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.2s;
}

.student-card:hover{
    box-shadow:0 5px 18px rgba(0,0,0,.1);
    transform:translateY(-1px);
}

.student-main{
    display:flex;
    align-items:center;
    gap:15px;
}

.student-icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#eeeaff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.student-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:5px;
}

.student-info{
    color:#777;
    font-size:14px;
}

.student-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:0;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.edit-btn{
    background:#eeeaff;
    color:#5148d8;
}

.delete-btn{
    background:#ffe8e8;
    color:#d33;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.loading{
    text-align:center;
    padding:40px;
    color:#555;
}

.details-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.detail-item{
    border:1px solid #eee;
    border-radius:12px;
    padding:15px;
}

.detail-label{
    color:#777;
    font-size:13px;
    margin-bottom:6px;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.save-btn{
    background:#5148d8;
    color:white;
}

.cancel-btn{
    background:#eee;
}

.staff-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 10px;
    background:#ffffff22;
    border:1px solid #ffffff55;
    border-radius:20px;
    font-size:12px;
}

.error-box{
    color:#d33;
    font-weight:bold;
}

@media(max-width:700px){

    .container{
        width:100%;
        margin:0;
        border-radius:0;
        min-height:100vh;
    }

    .header{
        padding:22px;
    }

    .header h1{
        font-size:23px;
    }

    .header p{
        font-size:13px;
    }

    .content{
        padding:20px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .student-card{
        align-items:flex-start;
        gap:15px;
        flex-direction:column;
    }

    .student-actions{
        width:100%;
    }

    .student-actions button{
        flex:1;
    }

    .details-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="header-left">

            <div class="logo-circle">
                🎓
            </div>

            <div>

                <h1>
                    Student Details
                </h1>

                <p>
                    Music Academy Student Management
                </p>

                <div
                    id="staffBadge"
                    class="staff-badge"
                    style="display:none;"
                >
                    Staff Access
                </div>

            </div>

        </div>

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>

    </div>


    <div class="content">

        <!-- ================= STUDENT LIST ================= -->

        <div id="listSection">

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔎 Search student name or mobile"
                >

                <select id="batchFilter">

                    <option value="">
                        All Batches
                    </option>

                </select>

            </div>


            <div class="section-title">

                <h2>
                    Students
                </h2>

                <div
                    class="count"
                    id="studentCount"
                >
                    0 Students
                </div>

            </div>


            <div
                id="loading"
                class="loading"
            >
                Loading students...
            </div>


            <div
                id="studentList"
                class="student-list"
            ></div>

        </div>


        <!-- ================= EDIT ================= -->

        <div
            id="detailsSection"
            style="display:none;"
        >

            <div class="section-title">

                <h2>
                    Edit Student
                </h2>

            </div>


            <div class="details-grid">

                <div class="detail-item">

                    <div class="detail-label">
                        Student Full Name
                    </div>

                    <input
                        id="editName"
                        type="text"
                    >

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Mobile Number
                    </div>

                    <input
                        id="editMobile"
                        type="text"
                    >

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Instrument
                    </div>

                    <select id="editInstrument"></select>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Batch
                    </div>

                    <select id="editBatch"></select>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Monthly Fees
                    </div>

                    <input
                        id="editFees"
                        type="number"
                        min="0"
                    >

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Joining Date
                    </div>

                    <input
                        id="editJoiningDate"
                        type="date"
                    >

                </div>

            </div>


            <div class="form-buttons">

                <button
                    class="btn save-btn"
                    onclick="saveStudent()"
                >
                    💾 Save Changes
                </button>

                <button
                    class="btn cancel-btn"
                    onclick="showList()"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>

</div>


<script>

// =====================================================
// GLOBAL VARIABLES
// =====================================================

let students = [];

let selectedStudent = null;

let isStaff = false;

let staffInfo = null;

let ownerInfo = null;


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        await detectLogin();

    }
);


// =====================================================
// DETECT LOGIN
// =====================================================

async function detectLogin(){

    try{

        // =================================================
        // STAFF
        // =================================================

        let staffSaved =
            localStorage.getItem("staffLogin");

        if(!staffSaved){

            staffSaved =
                sessionStorage.getItem("staffLogin");

        }

        if(staffSaved){

            try{

                staffInfo =
                    JSON.parse(staffSaved);

            }
            catch(e){

                staffInfo = null;

            }

            if(
                staffInfo &&
                staffInfo.id &&
                staffInfo.name &&
                staffInfo.email &&
                staffInfo.mobile
            ){

                isStaff = true;

                document.getElementById(
                    "staffBadge"
                ).style.display =
                    "inline-block";

                await loadStudents();

                return;

            }

        }


        // =================================================
        // OWNER
        // =================================================

        let ownerSaved =
            localStorage.getItem("ownerLogin");

        if(!ownerSaved){

            ownerSaved =
                sessionStorage.getItem("ownerLogin");

        }

        if(ownerSaved){

            try{

                ownerInfo =
                    JSON.parse(ownerSaved);

            }
            catch(e){

                ownerInfo = null;

            }

            if(
                ownerInfo &&
                ownerInfo.id
            ){

                isStaff = false;

                // Get real authenticated user
                try{

                    const {
                        data: authData
                    } =
                        await supabaseClient.auth.getUser();

                    if(
                        authData &&
                        authData.user &&
                        authData.user.id
                    ){

                        ownerInfo.id =
                            authData.user.id;

                        ownerInfo.email =
                            authData.user.email ||
                            ownerInfo.email;

                    }

                }
                catch(e){

                    console.log(
                        "Auth user check skipped:",
                        e
                    );

                }

                await loadStudents();

                return;

            }

        }


        // =================================================
        // NO LOGIN
        // =================================================

        alert(
            "Please login first."
        );

        window.location.replace(
            "index.html"
        );

    }
    catch(error){

        console.error(
            "Login Error:",
            error
        );

        alert(
            "Login information error."
        );

        window.location.replace(
            "index.html"
        );

    }

}


// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents(){

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.display =
        "block";

    loading.innerHTML =
        "Loading students...";

    document.getElementById(
        "studentList"
    ).innerHTML =
        "";

    try{

        let data = null;

        let error = null;


        // =================================================
        // STAFF
        // =================================================

        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_get_students_by_login",
                    {
                        p_name:
                            staffInfo.name,

                        p_email:
                            staffInfo.email,

                        p_mobile:
                            staffInfo.mobile
                    }
                );

            data =
                result.data;

            error =
                result.error;

        }


        // =================================================
        // OWNER
        // =================================================

        else{

            if(
                !ownerInfo ||
                !ownerInfo.id
            ){

                throw new Error(
                    "Owner login information not found."
                );

            }

            const result =
                await supabaseClient
                    .from("students")
                    .select("*")
                    .eq(
                        "owner_id",
                        ownerInfo.id
                    )
                    .order(
                        "full_name"
                    );

            data =
                result.data;

            error =
                result.error;

        }


        if(error){

            throw error;

        }


        // =================================================
        // STAFF DATA
        // =================================================

        if(isStaff){

            /*
             * Support both formats:
             *
             * 1. { success:true, students:[...] }
             *
             * 2. [ {...}, {...} ]
             */

            if(
                data &&
                data.success === true &&
                Array.isArray(data.students)
            ){

                students =
                    data.students;

            }
            else if(
                Array.isArray(data)
            ){

                students =
                    data;

            }
            else{

                throw new Error(
                    data?.message ||
                    "No student data found."
                );

            }

        }


        // =================================================
        // OWNER DATA
        // =================================================

        else{

            students =
                Array.isArray(data)
                ? data
                : [];

        }


        // =================================================
        // NORMALIZE STAFF DATA
        // =================================================

        students =
            students.map(
                student => {

                    return {

                        ...student,

                        id:
                            student.id,

                        full_name:
                            student.full_name ||
                            student.student_name ||
                            student.name ||
                            student.fullName ||
                            "",

                        mobile_number:
                            student.mobile_number ||
                            student.mobile ||
                            "",

                        instrument:
                            student.instrument ||
                            student.instrument_name ||
                            "",

                        batch:
                            student.batch ||
                            student.batch_name ||
                            "",

                        fees_amount:
                            student.fees_amount ??
                            student.monthly_fee ??
                            student.fee_amount ??
                            student.fees ??
                            0,

                        joining_date:
                            student.joining_date ||
                            ""

                    };

                }
            );


        loading.style.display =
            "none";

        createBatchFilter();

        renderStudents();

    }
    catch(error){

        console.error(
            "Student Loading Error:",
            error
        );

        loading.style.display =
            "block";

        loading.innerHTML =
            `
            <div class="error-box">

                ❌ Error loading students

                <br><br>

                ${escapeHtml(
                    error.message || ""
                )}

            </div>
            `;

    }

}


// =====================================================
// CREATE BATCH FILTER
// =====================================================

function createBatchFilter(){

    const select =
        document.getElementById(
            "batchFilter"
        );

    select.innerHTML =
        `
        <option value="">
            All Batches
        </option>
        `;

    const batches =
        [
            ...new Set(
                students
                    .map(
                        s =>
                            s.batch ||
                            s.batch_name ||
                            ""
                    )
                    .filter(Boolean)
            )
        ]
        .sort();

    batches.forEach(
        batch => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                batch;

            option.textContent =
                batch;

            select.appendChild(
                option
            );

        }
    );

}


// =====================================================
// RENDER STUDENTS
// =====================================================

function renderStudents(){

    const list =
        document.getElementById(
            "studentList"
        );

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();

    const batch =
        document.getElementById(
            "batchFilter"
        ).value;


    const filtered =
        students.filter(
            student => {

                const name =
                    String(
                        student.full_name ||
                        student.student_name ||
                        student.name ||
                        student.fullName ||
                        ""
                    )
                    .toLowerCase();

                const mobile =
                    String(
                        student.mobile_number ||
                        student.mobile ||
                        ""
                    )
                    .toLowerCase();

                const studentBatch =
                    String(
                        student.batch ||
                        student.batch_name ||
                        ""
                    );


                const matchSearch =
                    !search ||
                    name.includes(search) ||
                    mobile.includes(search);

                const matchBatch =
                    !batch ||
                    studentBatch === batch;

                return (
                    matchSearch &&
                    matchBatch
                );

            }
        );


    document.getElementById(
        "studentCount"
    ).textContent =
        filtered.length +
        " Students";


    if(filtered.length === 0){

        list.innerHTML =
            `
            <div class="empty">

                <div style="font-size:45px;">
                    👨‍🎓
                </div>

                <h3>
                    No students found
                </h3>

                <p>
                    Students added by the owner
                    will appear here.
                </p>

            </div>
            `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            student => {

                const studentName =
                    student.full_name ||
                    student.student_name ||
                    student.name ||
                    student.fullName ||
                    "No Name";

                const studentMobile =
                    student.mobile_number ||
                    student.mobile ||
                    "-";

                const studentInstrument =
                    student.instrument ||
                    student.instrument_name ||
                    "-";

                const studentBatch =
                    student.batch ||
                    student.batch_name ||
                    "-";

                return `

                <div class="student-card">

                    <div class="student-main">

                        <div class="student-icon">
                            👤
                        </div>

                        <div>

                            <div class="student-name">

                                ${escapeHtml(
                                    studentName
                                )}

                            </div>

                            <div class="student-info">

                                📱
                                ${escapeHtml(
                                    studentMobile
                                )}

                                &nbsp; | &nbsp;

                                🎵
                                ${escapeHtml(
                                    studentInstrument
                                )}

                                &nbsp; | &nbsp;

                                🕐
                                ${escapeHtml(
                                    studentBatch
                                )}

                            </div>

                        </div>

                    </div>


                    <div class="student-actions">

                        <button
                            class="btn edit-btn"
                            onclick="editStudent('${student.id}')"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="btn delete-btn"
                            onclick="deleteStudent('${student.id}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


// =====================================================
// EDIT STUDENT
// =====================================================

async function editStudent(id){

    selectedStudent =
        students.find(
            student =>
                String(student.id) ===
                String(id)
        );


    if(!selectedStudent){

        alert(
            "Student not found."
        );

        return;

    }


    document.getElementById(
        "listSection"
    ).style.display =
        "none";

    document.getElementById(
        "detailsSection"
    ).style.display =
        "block";


    document.getElementById(
        "editName"
    ).value =
        selectedStudent.full_name ||
        selectedStudent.student_name ||
        selectedStudent.name ||
        selectedStudent.fullName ||
        "";


    document.getElementById(
        "editMobile"
    ).value =
        selectedStudent.mobile_number ||
        selectedStudent.mobile ||
        "";


    document.getElementById(
        "editFees"
    ).value =
        selectedStudent.fees_amount ??
        selectedStudent.monthly_fee ??
        selectedStudent.fee_amount ??
        selectedStudent.fees ??
        0;


    document.getElementById(
        "editJoiningDate"
    ).value =
        selectedStudent.joining_date ||
        "";


    await loadEditDropdowns();

}


// =====================================================
// LOAD EDIT DROPDOWNS
// =====================================================

async function loadEditDropdowns(){

    const instrumentSelect =
        document.getElementById(
            "editInstrument"
        );

    const batchSelect =
        document.getElementById(
            "editBatch"
        );


    let instruments = [];

    let batches = [];


    try{

        // =================================================
        // STAFF
        // =================================================

        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_get_dropdowns",
                    {
                        p_staff_id:
                            staffInfo.id
                    }
                );


            if(result.error)
                throw result.error;


            if(
                result.data &&
                result.data.success === true
            ){

                instruments =
                    result.data.instruments ||
                    [];

                batches =
                    result.data.batches ||
                    [];

            }
            else{

                throw new Error(
                    result.data?.message ||
                    "Unable to load dropdowns."
                );

            }

        }


        // =================================================
        // OWNER
        // =================================================

        else{

            if(
                !ownerInfo ||
                !ownerInfo.id
            ){

                throw new Error(
                    "Owner login information not found."
                );

            }


            const iResult =
                await supabaseClient
                    .from("instruments")
                    .select("*")
                    .eq(
                        "owner_id",
                        ownerInfo.id
                    )
                    .order(
                        "name"
                    );


            if(iResult.error)
                throw iResult.error;


            const bResult =
                await supabaseClient
                    .from("batches")
                    .select("*")
                    .eq(
                        "owner_id",
                        ownerInfo.id
                    )
                    .order(
                        "name"
                    );


            if(bResult.error)
                throw bResult.error;


            instruments =
                iResult.data ||
                [];

            batches =
                bResult.data ||
                [];

        }


        // =================================================
        // INSTRUMENT
        // =================================================

        instrumentSelect.innerHTML =
            "";

        instruments.forEach(
            item => {

                const name =
                    item.name ||
                    item.instrument ||
                    item.instrument_name ||
                    "";

                if(!name)
                    return;

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    name;

                option.textContent =
                    name;

                instrumentSelect.appendChild(
                    option
                );

            }
        );


        // =================================================
        // BATCH
        // =================================================

        batchSelect.innerHTML =
            "";

        batches.forEach(
            item => {

                const name =
                    item.name ||
                    item.batch ||
                    item.batch_name ||
                    "";

                if(!name)
                    return;

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    name;

                option.textContent =
                    name;

                batchSelect.appendChild(
                    option
                );

            }
        );


        // =================================================
        // CURRENT VALUES
        // =================================================

        instrumentSelect.value =
            selectedStudent.instrument ||
            selectedStudent.instrument_name ||
            "";

        batchSelect.value =
            selectedStudent.batch ||
            selectedStudent.batch_name ||
            "";

    }
    catch(error){

        console.error(
            "Dropdown Error:",
            error
        );

        alert(
            "Unable to load instrument/batch.\n\n" +
            (
                error.message ||
                ""
            )
        );

    }

}


// =====================================================
// SAVE STUDENT
// =====================================================

async function saveStudent(){

    if(!selectedStudent){

        alert(
            "Student not selected."
        );

        return;

    }


    const name =
        document.getElementById(
            "editName"
        )
        .value
        .trim();


    const mobile =
        document.getElementById(
            "editMobile"
        )
        .value
        .trim();


    const instrument =
        document.getElementById(
            "editInstrument"
        ).value;


    const batch =
        document.getElementById(
            "editBatch"
        ).value;


    const fees =
        Number(
            document.getElementById(
                "editFees"
            ).value ||
            0
        );


    const joiningDate =
        document.getElementById(
            "editJoiningDate"
        ).value;


    if(!name){

        alert(
            "Student name is required."
        );

        return;

    }


    if(!mobile){

        alert(
            "Mobile number is required."
        );

        return;

    }


    try{

        // =================================================
        // STAFF UPDATE
        // =================================================

        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_update_student",
                    {

                        p_staff_id:
                            staffInfo.id,

                        p_student_id:
                            selectedStudent.id,

                        p_full_name:
                            name,

                        p_mobile:
                            mobile,

                        p_instrument:
                            instrument,

                        p_batch:
                            batch,

                        p_fees:
                            fees,

                        p_joining_date:
                            joiningDate ||
                            null

                    }
                );


            if(result.error)
                throw result.error;


            if(
                !result.data ||
                result.data.success !== true
            ){

                throw new Error(
                    result.data?.message ||
                    "Student update failed."
                );

            }


            alert(
                "✅ Student updated successfully."
            );


            selectedStudent =
                null;


            await loadStudents();

            showList();

            return;

        }


        // =================================================
        // OWNER UPDATE
        // =================================================

        if(
            !ownerInfo ||
            !ownerInfo.id
        ){

            throw new Error(
                "Owner login information not found."
            );

        }


        let ownerId =
            ownerInfo.id;


        try{

            const {
                data: authData
            } =
                await supabaseClient.auth.getUser();

            if(
                authData &&
                authData.user &&
                authData.user.id
            ){

                ownerId =
                    authData.user.id;

            }

        }
        catch(e){

            console.log(
                "Auth check skipped:",
                e
            );

        }


        const result =
            await supabaseClient
                .from("students")
                .update({

                    full_name:
                        name,

                    mobile_number:
                        mobile,

                    instrument:
                        instrument,

                    batch:
                        batch,

                    fees_amount:
                        fees,

                    joining_date:
                        joiningDate ||
                        null

                })
                .eq(
                    "id",
                    selectedStudent.id
                )
                .eq(
                    "owner_id",
                    ownerId
                )
                .select()
                .single();


        if(result.error)
            throw result.error;


        if(!result.data){

            throw new Error(
                "Student was not updated."
            );

        }


        alert(
            "✅ Student updated successfully."
        );


        selectedStudent =
            null;


        await loadStudents();

        showList();

    }
    catch(error){

        console.error(
            "Update Student Error:",
            error
        );

        alert(
            "❌ Student update failed:\n\n" +
            (
                error.message ||
                error
            )
        );

    }

}

// DELETE STUDENT
// =====================================================

async function deleteStudent(id){

    const student =
        students.find(
            s =>
                String(s.id) ===
                String(id)
        );


    if(!student){

        alert(
            "Student not found."
        );

        return;

    }


    const studentName =
        student.full_name ||
        student.student_name ||
        student.name ||
        student.fullName ||
        "this student";


    const confirmDelete =
        confirm(
            "Delete " +
            studentName +
            "?"
        );


    if(!confirmDelete)
        return;


    try{

        // =================================================
        // STAFF
        // =================================================

        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_delete_student",
                    {

                        p_staff_id:
                            staffInfo.id,

                        p_student_id:
                            id

                    }
                );


            if(result.error)
                throw result.error;


            if(
                !result.data ||
                result.data.success !== true
            ){

                throw new Error(
                    result.data?.message ||
                    "Delete failed."
                );

            }

        }


        // =================================================
        // OWNER
        // =================================================

        else{

            if(
                !ownerInfo ||
                !ownerInfo.id
            ){

                throw new Error(
                    "Owner login information not found."
                );

            }


            let ownerId =
                ownerInfo.id;


            try{

                const {
                    data: authData
                } =
                    await supabaseClient.auth.getUser();

                if(
                    authData &&
                    authData.user &&
                    authData.user.id
                ){

                    ownerId =
                        authData.user.id;

                }

            }
            catch(e){

                console.log(
                    "Auth check skipped:",
                    e
                );

            }


            const result =
                await supabaseClient
                    .from("students")
                    .delete()
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "owner_id",
                        ownerId
                    )
                    .select();


            if(result.error)
                throw result.error;


            if(
                !result.data ||
                result.data.length === 0
            ){

                throw new Error(
                    "Student was not deleted."
                );

            }

        }


        alert(
            "✅ Student deleted successfully."
        );


        await loadStudents();

    }
    catch(error){

        console.error(
            "Delete Error:",
            error
        );

        alert(
            "❌ Delete failed:\n\n" +
            (
                error.message ||
                error
            )
        );

    }

}

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
