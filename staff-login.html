<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login - Music Academy</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            padding: 20px;

        }


        .login-box {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

        }


        .logo {

            width: 75px;

            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

        }


        h1 {

            text-align: center;

            color: #222;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 28px;

        }


        h2 {

            text-align: center;

            color: #333;

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;

        }


        input {

            width: 100%;

            padding: 14px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6c63ff;

            box-shadow:
                0 0 0 3px
                rgba(108,99,255,0.1);

        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .secondary-btn {

            margin-top: 10px;

            background: #f1f3f5;

            color: #333;

        }


        .switch-btn {

            margin-top: 15px;

            background: transparent;

            color: #1d2671;

            border:
                1px solid #1d2671;

        }


        .message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            display: none;

            font-size: 14px;

            line-height: 1.5;

        }


        .error {

            display: block;

            background: #ffe8e8;

            color: #c62828;

        }


        .success {

            display: block;

            background: #e8f7ed;

            color: #16803c;

        }


        .back {

            margin-top: 18px;

            text-align: center;

        }


        .back a {

            color: #1d2671;

            text-decoration: none;

            font-weight: bold;

        }


        .section {

            display: none;

        }


        .section.active {

            display: block;

        }


        .info {

            background: #f5f6ff;

            border-radius: 10px;

            padding: 12px;

            margin-bottom: 18px;

            color: #555;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;

        }


        @media(max-width: 480px) {

            body {

                padding: 15px;

                align-items: flex-start;

                padding-top: 25px;

            }

            .login-box {

                padding: 28px 20px;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        🎵

    </div>


    <h1>

        Staff Portal

    </h1>


    <div class="subtitle">

        Music Academy

    </div>



    <!-- ================================================= -->
    <!-- STAFF LOGIN -->
    <!-- ================================================= -->

    <div
        id="loginSection"
        class="section active"
    >

        <h2>

            Staff Login

        </h2>


        <div class="info">

            Enter your approved Staff details
            to access the academy.

        </div>


        <form id="staffLoginForm">


            <label>

                Staff Name

            </label>

            <input
                type="text"
                id="staffName"
                placeholder="Enter your full name"
                required
            >


            <label>

                Email ID

            </label>

            <input
                type="email"
                id="staffEmail"
                placeholder="Enter your email"
                required
            >


            <label>

                Mobile Number

            </label>

            <input
                type="tel"
                id="staffMobile"
                placeholder="Enter mobile number"
                maxlength="15"
                required
            >


            <button
                type="submit"
                id="loginBtn"
            >

                Login

            </button>


        </form>


        <button
            type="button"
            class="switch-btn"
            onclick="showRequest()"
        >

            Request Staff Access

        </button>


    </div>



    <!-- ================================================= -->
    <!-- STAFF ACCESS REQUEST -->
    <!-- ================================================= -->

    <div
        id="requestSection"
        class="section"
    >

        <h2>

            Staff Access Request

        </h2>


        <div class="info">

            Enter your details and the Owner
            Email. Your request will be sent
            to the Owner for approval.

        </div>


        <form id="requestForm">


            <label>

                Owner Email

            </label>

            <input
                type="email"
                id="requestOwnerEmail"
                placeholder="Enter Owner Email"
                required
            >


            <label>

                Staff Name

            </label>

            <input
                type="text"
                id="requestName"
                placeholder="Enter your full name"
                required
            >


            <label>

                Email ID

            </label>

            <input
                type="email"
                id="requestEmail"
                placeholder="Enter your email"
                required
            >


            <label>

                Mobile Number

            </label>

            <input
                type="tel"
                id="requestMobile"
                placeholder="Enter mobile number"
                maxlength="15"
                required
            >


            <button
                type="submit"
                id="requestBtn"
            >

                SEND ACCESS REQUEST

            </button>


        </form>


        <button
            type="button"
            class="secondary-btn"
            onclick="showLogin()"
        >

            ← Back to Staff Login

        </button>


    </div>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- BACK -->

    <div class="back">

        <a href="index.html">

            ← Back to Main Login

        </a>

    </div>


</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */


const loginForm =
    document.getElementById(
        "staffLoginForm"
    );


const requestForm =
    document.getElementById(
        "requestForm"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const requestBtn =
    document.getElementById(
        "requestBtn"
    );


const message =
    document.getElementById(
        "message"
    );



/* =====================================================
   MESSAGE
===================================================== */


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}



function clearMessage() {

    message.textContent = "";

    message.className =
        "message";

}



/* =====================================================
   SHOW LOGIN
===================================================== */


function showLogin() {

    clearMessage();

    document
        .getElementById(
            "loginSection"
        )
        .classList
        .add("active");


    document
        .getElementById(
            "requestSection"
        )
        .classList
        .remove("active");

}



/* =====================================================
   SHOW REQUEST
===================================================== */


function showRequest() {

    clearMessage();

    document
        .getElementById(
            "loginSection"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "requestSection"
        )
        .classList
        .add("active");

}



/* =====================================================
   STAFF LOGIN
===================================================== */


loginForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        clearMessage();


        const name =
            document
                .getElementById(
                    "staffName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "staffEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const mobile =
            document
                .getElementById(
                    "staffMobile"
                )
                .value
                .trim();



        if (
            !name ||
            !email ||
            !mobile
        ) {

            showMessage(
                "Please fill all details.",
                "error"
            );

            return;

        }



        loginBtn.disabled = true;

        loginBtn.textContent =
            "Checking...";



        try {


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "verify_staff_login",
                    {

                        p_name: name,

                        p_email: email,

                        p_mobile: mobile

                    }
                );



            if (error) {

                console.error(error);

                showMessage(
                    "Login error: " +
                    error.message,
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;

            }



            if (
                !data ||
                data.success !== true
            ) {

                showMessage(
                    "Access denied. Please check your details or wait for Owner approval.",
                    "error"
                );

                loginBtn.disabled = false;

                loginBtn.textContent =
                    "Login";

                return;

            }



            /* SAVE STAFF LOGIN */

            localStorage.setItem(

                "staffLogin",

                JSON.stringify({

                    id:
                        data.id,

                    owner_id:
                        data.owner_id,

                    name:
                        data.name,

                    email:
                        data.email,

                    mobile:
                        data.mobile

                })

            );



            showMessage(
                "Login successful! Opening dashboard...",
                "success"
            );



            setTimeout(
                function() {

                    window.location.href =
                        "staff-dashboard.html";

                },
                700
            );


        }

        catch(err) {

            console.error(err);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";

        }

    }
);



/* =====================================================
   STAFF ACCESS REQUEST
===================================================== */


requestForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        clearMessage();


        const ownerEmail =
            document
                .getElementById(
                    "requestOwnerEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const name =
            document
                .getElementById(
                    "requestName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "requestEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const mobile =
            document
                .getElementById(
                    "requestMobile"
                )
                .value
                .trim();



        if (
            !ownerEmail ||
            !name ||
            !email ||
            !mobile
        ) {

            showMessage(
                "Please fill all details.",
                "error"
            );

            return;

        }



        requestBtn.disabled = true;

        requestBtn.textContent =
            "Sending...";



        try {


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "create_staff_access_request",
                    {

                        p_owner_email:
                            ownerEmail,

                        p_name:
                            name,

                        p_email:
                            email,

                        p_mobile:
                            mobile

                    }
                );



            if (error) {

                console.error(error);

                showMessage(
                    "Request error: " +
                    error.message,
                    "error"
                );

                requestBtn.disabled = false;

                requestBtn.textContent =
                    "SEND ACCESS REQUEST";

                return;

            }



            if (
                !data ||
                data.success !== true
            ) {

                showMessage(
                    data?.message ||
                    "Request could not be sent.",
                    "error"
                );

                requestBtn.disabled = false;

                requestBtn.textContent =
                    "SEND ACCESS REQUEST";

                return;

            }



            /* SUCCESS */

            showMessage(
                "Access request sent successfully! Please wait for Owner approval.",
                "success"
            );



            requestForm.reset();



            requestBtn.disabled = false;

            requestBtn.textContent =
                "SEND ACCESS REQUEST";



            setTimeout(
                function() {

                    showLogin();

                },
                2000
            );


        }

        catch(err) {

            console.error(err);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            requestBtn.disabled = false;

            requestBtn.textContent =
                "SEND ACCESS REQUEST";

        }

    }
);


</script>


</body>

</html>
