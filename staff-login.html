<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login - Music Academy</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d2671, #c33764);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #ffe8e8;
            color: #c62828;
        }

        .success {
            display: block;
            background: #e8f7ed;
            color: #16803c;
        }

        .back {
            margin-top: 18px;
            text-align: center;
        }

        .back a {
            color: #1d2671;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎵</div>

    <h1>Staff Login</h1>
    <div class="subtitle">Music Academy</div>

    <form id="staffLoginForm">

        <label>Staff Name</label>
        <input
            type="text"
            id="staffName"
            placeholder="Enter your full name"
            required
        >

        <label>Email ID</label>
        <input
            type="email"
            id="staffEmail"
            placeholder="Enter your email"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            id="staffMobile"
            placeholder="Enter mobile number"
            maxlength="15"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back">
        <a href="index.html">← Back to Login</a>
    </div>

</div>

<script>

const form = document.getElementById("staffLoginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("staffName").value.trim();
    const email = document.getElementById("staffEmail").value.trim();
    const mobile = document.getElementById("staffMobile").value.trim();

    if (!name || !email || !mobile) {
        showMessage("Please fill all details.", "error");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";
    message.className = "message";

    try {

        const { data, error } = await supabaseClient.rpc(
            "verify_staff_login",
            {
                p_name: name,
                p_email: email,
                p_mobile: mobile
            }
        );

        if (error) {
            console.error(error);
            showMessage("Login error: " + error.message, "error");

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        if (!data || data.success !== true) {

            showMessage(
                "Access denied. Please check your details or wait for Owner approval.",
                "error"
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
            return;
        }

        // Save staff information
        localStorage.setItem(
            "staffLogin",
            JSON.stringify({
                id: data.id,
                owner_id: data.owner_id,
                name: data.name,
                email: data.email,
                mobile: data.mobile
            })
        );

        showMessage("Login successful! Opening dashboard...", "success");

        setTimeout(function() {
            window.location.href = "staff-dashboard.html";
        }, 700);

    } catch (err) {

        console.error(err);

        showMessage(
            "Something went wrong. Please try again.",
            "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

});

</script>

</body>
</html>
