<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Staff Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* MAIN CARD */

.card{

    width:100%;

    max-width:430px;

    background:#ffffff;

    border-radius:25px;

    padding:30px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

    position:relative;
}


/* BACK BUTTON */

.back-btn{

    position:absolute;

    top:18px;

    right:18px;

    border:none;

    background:#f1f3f5;

    color:#333;

    border-radius:20px;

    padding:8px 14px;

    cursor:pointer;

    font-weight:bold;

    width:auto;

}


/* LOGO */

.logo{

    width:85px;

    height:85px;

    margin:5px auto 15px;

    border-radius:20px;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

}


.logo img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* CLASS NAME */

.academy-name{

    text-align:center;

    font-size:25px;

    font-weight:800;

    color:#222;

    margin-bottom:5px;

    word-break:break-word;

}


.subtitle{

    text-align:center;

    color:#777;

    margin-bottom:25px;

    font-size:15px;

}


/* SECTIONS */

.section{

    display:none;

}


.section.active{

    display:block;

}


/* TITLE */

h2{

    text-align:center;

    color:#333;

    margin-bottom:20px;

    font-size:23px;

}


/* INFO */

.info{

    background:#f5f6ff;

    border-radius:12px;

    padding:13px;

    margin-bottom:20px;

    color:#555;

    font-size:13px;

    line-height:1.5;

    text-align:center;

}


/* LABEL */

label{

    display:block;

    font-weight:bold;

    margin-bottom:7px;

    color:#333;

    font-size:14px;

}


/* INPUT */

input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    margin-bottom:16px;

    font-size:15px;

    outline:none;

    background:#fff;

}


input:focus{

    border-color:#6a11cb;

    box-shadow:
    0 0 0 3px rgba(106,17,203,.10);

}


/* MAIN BUTTON */

.main-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 8px 18px rgba(37,117,252,.20);

}


.main-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* REQUEST BUTTON */

.request-btn{

    width:100%;

    padding:13px;

    margin-top:13px;

    border-radius:12px;

    border:2px solid #6a11cb;

    background:#fff;

    color:#6a11cb;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* SECONDARY */

.secondary-btn{

    width:100%;

    padding:13px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    background:#f1f3f5;

    color:#333;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}


/* MESSAGE */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    line-height:1.4;

}


.message.success{

    display:block;

    background:#e8f8ee;

    color:#18743b;

}


.message.error{

    display:block;

    background:#fdecec;

    color:#b42318;

}


/* MAIN LINK */

.main-link{

    text-align:center;

    margin-top:20px;

}


.main-link a{

    color:#2575fc;

    text-decoration:none;

    font-weight:bold;

    font-size:14px;

}


/* SMALL TEXT */

.small-text{

    text-align:center;

    color:#777;

    font-size:13px;

    line-height:1.5;

    margin-bottom:18px;

}


/* MOBILE */

@media(max-width:480px){

    body{

        padding:15px;

        align-items:flex-start;

        padding-top:25px;

    }


    .card{

        padding:28px 20px;

    }


    .academy-name{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="card">


<!-- BACK -->

<button
    class="back-btn"
    onclick="goBack()">

← Back

</button>


<!-- LOGO -->

<div
    class="logo"
    id="academyLogo">

🎵

</div>


<!-- CLASS NAME -->

<div
    id="academyName"
    class="academy-name">

Music Academy

</div>


<div class="subtitle">

Staff Portal

</div>


<!-- ========================= -->
<!-- STAFF LOGIN -->
<!-- ========================= -->

<div
    id="loginSection"
    class="section active">


<h2>Staff Login</h2>


<div class="info">

Login using your approved Staff
Name, Email and Mobile Number.

</div>


<label>

Staff Name

</label>

<input
    type="text"
    id="staffName"
    placeholder="Enter full name"
    autocomplete="name">


<label>

Email ID

</label>

<input
    type="email"
    id="staffEmail"
    placeholder="Enter email address"
    autocomplete="email">


<label>

Mobile Number

</label>

<input
    type="tel"
    id="staffMobile"
    placeholder="Enter mobile number"
    maxlength="15"
    inputmode="numeric"
    autocomplete="tel">


<div
    id="loginMessage"
    class="message">
</div>


<button
    class="main-btn"
    id="loginBtn"
    onclick="loginStaff()">

LOGIN

</button>


<button
    class="request-btn"
    onclick="showRequest()">

REQUEST STAFF ACCESS

</button>


</div>


<!-- ========================= -->
<!-- STAFF ACCESS REQUEST -->
<!-- ========================= -->

<div
    id="requestSection"
    class="section">


<h2>Staff Access Request</h2>


<div class="info">

Enter your details below.
The Owner will review and approve
your Staff access.

</div>


<label>

Staff Name

</label>

<input
    type="text"
    id="requestName"
    placeholder="Enter full name">


<label>

Email ID

</label>

<input
    type="email"
    id="requestEmail"
    placeholder="Enter email address">


<label>

Mobile Number

</label>

<input
    type="tel"
    id="requestMobile"
    placeholder="Enter mobile number"
    maxlength="15"
    inputmode="numeric">


<div
    id="requestMessage"
    class="message">
</div>


<button
    class="main-btn"
    id="requestBtn"
    onclick="sendAccessRequest()">

SEND ACCESS REQUEST

</button>


<button
    class="secondary-btn"
    onclick="showLogin()">

← BACK TO STAFF LOGIN

</button>


</div>


<!-- MAIN HOME -->

<div class="main-link">

<a href="index.html">

← Back to Main Login

</a>

</div>


</div>


<script>


/* ================================= */
/* HELPERS */
/* ================================= */


function showSection(id){

    document
        .querySelectorAll(".section")
        .forEach(function(section){

            section.classList.remove(
                "active"
            );

        });


    document
        .getElementById(id)
        .classList.add("active");


    clearMessages();

}


function showLogin(){

    showSection(
        "loginSection"
    );

}


function showRequest(){

    showSection(
        "requestSection"
    );

}


function goBack(){

    window.location.href =
        "index.html";

}


function clearMessages(){

    document
        .querySelectorAll(".message")
        .forEach(function(el){

            el.className =
                "message";

            el.textContent = "";

        });

}


function showMessage(
    id,
    text,
    type
){

    const el =
        document.getElementById(id);


    el.textContent = text;


    el.className =
        "message " + type;

}


/* ================================= */
/* LOAD ACADEMY BRANDING */
/* ================================= */


async function loadBranding(){

    try{

        /*
        We don't know Staff email/mobile
        when page first opens.

        So keep default class name until
        Staff details are entered.
        */

        const email =
            document
            .getElementById("staffEmail")
            .value
            .trim()
            .toLowerCase();


        const mobile =
            document
            .getElementById("staffMobile")
            .value
            .trim();


        if(
            !email ||
            !mobile
        ){

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "get_staff_branding",
            {

                p_email:
                    email,

                p_mobile:
                    mobile

            }
        );


        if(error){

            console.log(
                "Branding error:",
                error
            );

            return;

        }


        if(
            data &&
            data.success
        ){

            document
                .getElementById(
                    "academyName"
                )
                .textContent =
                    data.class_name ||
                    "Music Academy";


            if(data.logo_url){

                document
                    .getElementById(
                        "academyLogo"
                    )
                    .innerHTML =
                    `
                    <img
                        src="${data.logo_url}"
                        alt="Academy Logo">
                    `;

            }

        }


    }catch(error){

        console.log(
            "Branding error:",
            error
        );

    }

}


/* Load branding when email/mobile changes */

document
    .getElementById("staffEmail")
    .addEventListener(
        "blur",
        loadBranding
    );


document
    .getElementById("staffMobile")
    .addEventListener(
        "blur",
        loadBranding
    );


/* ================================= */
/* STAFF LOGIN */
/* ================================= */


async function loginStaff(){

    clearMessages();


    const name =
        document
        .getElementById("staffName")
        .value
        .trim();


    const email =
        document
        .getElementById("staffEmail")
        .value
        .trim()
        .toLowerCase();


    const mobile =
        document
        .getElementById("staffMobile")
        .value
        .trim();


    if(
        !name ||
        !email ||
        !mobile
    ){

        showMessage(
            "loginMessage",
            "Please enter Staff Name, Email and Mobile Number.",
            "error"
        );

        return;

    }


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    loginBtn.disabled = true;

    loginBtn.textContent =
        "CHECKING...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "verify_staff_login",
            {

                p_name:
                    name,

                p_email:
                    email,

                p_mobile:
                    mobile

            }
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.success !== true
        ){

            showMessage(
                "loginMessage",
                data?.message ||
                "Access denied. Please check your details or wait for Owner approval.",
                "error"
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "LOGIN";

            return;

        }


        /* SAVE STAFF LOGIN */

        localStorage.setItem(
            "staffLogin",
            JSON.stringify({

                id:
                    data.id,

                owner_id:
                    data.owner_id,

                name:
                    data.name,

                email:
                    data.email,

                mobile:
                    data.mobile

            })
        );


        showMessage(
            "loginMessage",
            "Login successful! Opening dashboard...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "staff-dashboard.html";

            },
            700
        );


    }catch(error){

        console.error(
            "Staff Login Error:",
            error
        );


        showMessage(
            "loginMessage",
            error.message ||
            "Staff login failed.",
            "error"
        );


        loginBtn.disabled = false;

        loginBtn.textContent =
            "LOGIN";

    }

}


/* ================================= */
/* SEND STAFF ACCESS REQUEST */
/* ================================= */


async function sendAccessRequest(){

    const name =
        document
        .getElementById("requestName")
        .value
        .trim();


    const email =
        document
        .getElementById("requestEmail")
        .value
        .trim()
        .toLowerCase();


    const mobile =
        document
        .getElementById("requestMobile")
        .value
        .trim();


    if(
        !name ||
        !email ||
        !mobile
    ){

        showMessage(
            "requestMessage",
            "Please fill all details.",
            "error"
        );

        return;

    }


    const requestBtn =
        document.getElementById(
            "requestBtn"
        );


    requestBtn.disabled = true;

    requestBtn.textContent =
        "SENDING...";


    try{

        /*
        IMPORTANT:

        No Owner Email is required.

        The SQL RPC automatically finds
        the academy Owner.
        */


        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "create_staff_access_request",
            {

                p_name:
                    name,

                p_email:
                    email,

                p_mobile:
                    mobile

            }
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.success !== true
        ){

            showMessage(
                "requestMessage",
                data?.message ||
                "Access request could not be sent.",
                "error"
            );

            return;

        }


        showMessage(
            "requestMessage",
            "Access request sent successfully! Please wait for Owner approval.",
            "success"
        );


        document
            .getElementById(
                "requestName"
            )
            .value = "";


        document
            .getElementById(
                "requestEmail"
            )
            .value = "";


        document
            .getElementById(
                "requestMobile"
            )
            .value = "";


        setTimeout(
            function(){

                showLogin();

            },
            2000
        );


    }catch(error){

        console.error(
            "Access Request Error:",
            error
        );


        showMessage(
            "requestMessage",
            error.message ||
            "Access request failed.",
            "error"
        );

    }finally{

        requestBtn.disabled = false;

        requestBtn.textContent =
            "SEND ACCESS REQUEST";

    }

}


/* ================================= */
/* ENTER KEY */
/* ================================= */


document
    .getElementById("staffMobile")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                loginStaff();

            }

        }
    );


document
    .getElementById("requestMobile")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                sendAccessRequest();

            }

        }
    );


</script>


</body>

</html>
