<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

        }

        .container {

            width: 100%;

            max-width: 430px;

        }

        .card {

            background: white;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.25);

        }

        .header {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo {

            width: 90px;

            height: 90px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            color: white;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.18);

            overflow: hidden;

        }

        .logo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .academy-name {

            margin-top: 18px;

            margin-bottom: 6px;

            color: #222;

            font-size: 28px;

            font-weight: bold;

        }

        .subtitle {

            color: #777;

            font-size: 15px;

        }

        h2 {

            text-align: center;

            color: #222;

            margin-top: 25px;

            margin-bottom: 25px;

            font-size: 24px;

        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            color: #222;

            font-size: 14px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: #1d2671;

            box-shadow:
                0 0 0 2px
                rgba(29,38,113,0.08);

        }

        /* ========================= */
        /* REMEMBER ME */
        /* ========================= */

        .remember-row {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-top: 16px;

            color: #444;

            font-size: 14px;

            font-weight: normal;

        }

        .remember-row input {

            width: 17px;

            height: 17px;

            margin: 0;

            padding: 0;

            cursor: pointer;

            accent-color: #1d2671;

        }

        .remember-row label {

            margin: 0;

            font-size: 14px;

            font-weight: normal;

            cursor: pointer;

        }

        button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            margin-top: 20px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #1d2671,
                    #c33764
                );

            transition: 0.2s;

        }

        button:hover {

            opacity: 0.9;

            transform: scale(1.02);

        }

        button:active {

            transform: scale(0.98);

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        .back-button {

            background: #eeeeee;

            color: #222;

        }

        .back-button:hover {

            background: #e5e5e5;

            color: #222;

        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }

        .success {

            background: #e8f5e9;

            color: #2e7d32;

        }

        .error {

            background: #ffebee;

            color: #c62828;

        }

        .request-button {

            margin-top: 25px;

        }

        .request-heading {

            text-align: center;

            color: #222;

            margin-top: 0;

            margin-bottom: 25px;

            font-size: 24px;

        }

        .small-text {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 20px;

        }

        @media(max-width: 500px) {

            body {

                padding: 15px;

                align-items: flex-start;

                padding-top: 25px;

            }

            .card {

                padding: 28px 20px;

                border-radius: 20px;

            }

            .logo {

                width: 75px;

                height: 75px;

                font-size: 35px;

            }

            .academy-name {

                font-size: 24px;

            }

            h2 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ========================= -->
    <!-- STAFF LOGIN CARD -->
    <!-- ========================= -->

    <div class="card" id="loginCard">


        <div class="header">

            <div
                class="logo"
                id="logoBox"
            >

                🎵

            </div>

            <div
                class="academy-name"
                id="academyName"
            >

                Music Academy

            </div>

            <div class="subtitle">

                Staff Login

            </div>

        </div>


        <h2>

            👨‍💼 Staff Login

        </h2>


        <label>

            Staff Name

        </label>

        <input
            type="text"
            id="loginName"
            placeholder="Enter your name"
        >


        <label>

            Email Address

        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >


        <label>

            Mobile Number

        </label>

        <input
            type="tel"
            id="loginMobile"
            placeholder="Enter mobile number"
            maxlength="15"
        >


        <!-- ========================= -->
        <!-- REMEMBER ME -->
        <!-- ========================= -->

        <div class="remember-row">

            <input
                type="checkbox"
                id="rememberMe"
                checked
            >

            <label for="rememberMe">

                Remember Me

            </label>

        </div>


        <button
            id="loginButton"
            onclick="staffLogin()"
        >

            STAFF LOGIN

        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>


        <!-- REQUEST ACCESS -->

        <button
            class="request-button"
            onclick="showRequest()"
        >

            REQUEST STAFF ACCESS

        </button>


        <button
            class="back-button"
            onclick="goBack()"
        >

            ← Back

        </button>


    </div>



    <!-- ========================= -->
    <!-- REQUEST STAFF ACCESS CARD -->
    <!-- ========================= -->

    <div
        class="card"
        id="requestCard"
        style="display:none;"
    >


        <div class="header">

            <div class="logo">

                🎵

            </div>

            <div
                class="academy-name"
                id="requestAcademyName"
            >

                Music Academy

            </div>

            <div class="subtitle">

                Staff Access Request

            </div>

        </div>


        <h2 class="request-heading">

            📝 Request Staff Access

        </h2>


        <p class="small-text">

            Please enter your details below.
            The owner will review your request.

        </p>


        <label>

            Staff Name

        </label>

        <input
            type="text"
            id="requestName"
            placeholder="Enter your full name"
        >


        <label>

            Email Address

        </label>

        <input
            type="email"
            id="requestEmail"
            placeholder="Enter your email"
        >


        <label>

            Mobile Number

        </label>

        <input
            type="tel"
            id="requestMobile"
            placeholder="Enter mobile number"
            maxlength="15"
        >


        <button
            id="requestButton"
            onclick="sendAccessRequest()"
        >

            SEND REQUEST

        </button>


        <div
            id="requestMessage"
            class="message"
        ></div>


        <button
            class="back-button"
            onclick="showLogin()"
        >

            ← Back to Staff Login

        </button>


    </div>


</div>



<script>


// ========================================
// LOAD SAVED STAFF LOGIN
// ========================================

function loadSavedStaffLogin() {

    let saved = null;

    let storageType = null;


    // First check localStorage

    const localData =
        localStorage.getItem("staffLogin");


    if (localData) {

        try {

            saved =
                JSON.parse(localData);

            storageType =
                "localStorage";

        }
        catch (error) {

            localStorage.removeItem("staffLogin");

        }

    }


    // If not found, check sessionStorage

    if (!saved) {

        const sessionData =
            sessionStorage.getItem("staffLogin");


        if (sessionData) {

            try {

                saved =
                    JSON.parse(sessionData);

                storageType =
                    "sessionStorage";

            }
            catch (error) {

                sessionStorage.removeItem("staffLogin");

            }

        }

    }


    if (!saved) {

        return;

    }


    document
        .getElementById("loginName")
        .value =
        saved.name || "";


    document
        .getElementById("loginEmail")
        .value =
        saved.email || "";


    document
        .getElementById("loginMobile")
        .value =
        saved.mobile || "";


    // Remember Me ON only for localStorage

    document
        .getElementById("rememberMe")
        .checked =
        storageType === "localStorage";


    // Load branding if possible

    loadBranding();

}


// ========================================
// LOAD STAFF BRANDING
// ========================================

async function loadBranding() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const mobile =
        document
            .getElementById("loginMobile")
            .value
            .trim();


    if (!email || !mobile) {

        return;

    }


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "get_staff_branding",
                {
                    p_email: email,
                    p_mobile: mobile
                }
            );


        if (error) {

            console.log(error);

            return;

        }


        if (data && data.success) {

            document
                .getElementById("academyName")
                .textContent =
                    data.class_name ||
                    "Music Academy";


            document
                .getElementById("requestAcademyName")
                .textContent =
                    data.class_name ||
                    "Music Academy";


            if (data.logo_url) {

                document
                    .getElementById("logoBox")
                    .innerHTML =
                    `<img src="${data.logo_url}" alt="Logo">`;

            }

        }

    }
    catch (error) {

        console.log(error);

    }

}


document
    .getElementById("loginEmail")
    .addEventListener(
        "blur",
        loadBranding
    );


document
    .getElementById("loginMobile")
    .addEventListener(
        "blur",
        loadBranding
    );


// ========================================
// STAFF LOGIN
// ========================================

async function staffLogin() {


    const name =
        document
            .getElementById("loginName")
            .value
            .trim();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const mobile =
        document
            .getElementById("loginMobile")
            .value
            .trim();


    const rememberMe =
        document
            .getElementById("rememberMe")
            .checked;


    if (!name || !email || !mobile) {

        showMessage(
            "loginMessage",
            "Please fill all login details.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById("loginButton");


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "verify_staff_login",
                {
                    p_name: name,
                    p_email: email,
                    p_mobile: mobile
                }
            );


        if (error) {

            throw error;

        }


        if (!data || data.success === false) {

            showMessage(
                "loginMessage",
                data?.message ||
                "Staff access is not approved.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "STAFF LOGIN";

            return;

        }


        // ====================================
        // STAFF LOGIN DATA
        // ====================================

        const staffData = {

            id:
                data.id,

            owner_id:
                data.owner_id,

            name:
                data.name,

            email:
                data.email,

            mobile:
                data.mobile

        };


        // ====================================
        // CLEAR OLD LOGIN DATA
        // ====================================

        localStorage.removeItem("staffLogin");

        sessionStorage.removeItem("staffLogin");


        // ====================================
        // SAVE ACCORDING TO REMEMBER ME
        // ====================================

        if (rememberMe) {

            localStorage.setItem(
                "staffLogin",
                JSON.stringify(staffData)
            );

        }
        else {

            sessionStorage.setItem(
                "staffLogin",
                JSON.stringify(staffData)
            );

        }


        showMessage(
            "loginMessage",
            "Login successful.",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "staff-dashboard.html";

            },
            500
        );


    }
    catch (error) {

        console.error(error);


        showMessage(
            "loginMessage",
            error.message ||
            "Staff login failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "STAFF LOGIN";

    }

}



// ========================================
// SHOW REQUEST FORM
// ========================================

function showRequest() {

    document
        .getElementById("loginCard")
        .style.display =
        "none";


    document
        .getElementById("requestCard")
        .style.display =
        "block";

}



// ========================================
// SHOW LOGIN
// ========================================

function showLogin() {

    document
        .getElementById("requestCard")
        .style.display =
        "none";


    document
        .getElementById("loginCard")
        .style.display =
        "block";

}



// ========================================
// SEND ACCESS REQUEST
// ========================================

async function sendAccessRequest() {


    const name =
        document
            .getElementById("requestName")
            .value
            .trim();


    const email =
        document
            .getElementById("requestEmail")
            .value
            .trim();


    const mobile =
        document
            .getElementById("requestMobile")
            .value
            .trim();


    if (!name || !email || !mobile) {

        showMessage(
            "requestMessage",
            "Please fill all details.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById("requestButton");


    button.disabled = true;

    button.textContent =
        "SENDING...";


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "create_staff_access_request",
                {
                    p_name: name,
                    p_email: email,
                    p_mobile: mobile
                }
            );


        if (error) {

            throw error;

        }


        if (!data || data.success === false) {

            showMessage(
                "requestMessage",
                data?.message ||
                "Request failed.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "SEND REQUEST";

            return;

        }


        showMessage(
            "requestMessage",
            "Staff access request sent successfully.",
            "success"
        );


        document
            .getElementById("requestName")
            .value = "";


        document
            .getElementById("requestEmail")
            .value = "";


        document
            .getElementById("requestMobile")
            .value = "";


        button.disabled = false;

        button.textContent =
            "SEND REQUEST";


    }
    catch (error) {

        console.error(error);


        showMessage(
            "requestMessage",
            error.message ||
            "Request failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "SEND REQUEST";

    }

}



// ========================================
// MESSAGE
// ========================================

function showMessage(
    id,
    message,
    type
) {

    const element =
        document.getElementById(id);


    element.textContent =
        message;


    element.className =
        "message " + type;


    element.style.display =
        "block";

}



// ========================================
// BACK TO MAIN PAGE
// ========================================

function goBack() {

    window.location.href =
        "index.html";

}



// ========================================
// PAGE LOAD
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadSavedStaffLogin();

    }
);

</script>


</body>

</html>
