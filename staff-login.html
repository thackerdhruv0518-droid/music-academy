<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.box{

    width:100%;

    max-width:430px;

    background:white;

    border-radius:25px;

    padding:30px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);
}

.logo{

    width:85px;
    height:85px;

    margin:0 auto 15px;

    border-radius:20px;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    overflow:hidden;
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.academy-name{

    text-align:center;

    font-size:25px;

    font-weight:800;

    color:#222;

    margin-bottom:5px;
}

.subtitle{

    text-align:center;

    color:#777;

    margin-bottom:25px;
}

.section{

    display:none;
}

.section.active{

    display:block;
}

h2{

    text-align:center;

    color:#333;

    margin-bottom:20px;
}

.info{

    background:#f5f6ff;

    border-radius:10px;

    padding:12px;

    margin-bottom:18px;

    color:#555;

    font-size:13px;

    line-height:1.5;

    text-align:center;
}

label{

    display:block;

    font-weight:bold;

    margin-bottom:7px;

    color:#333;
}

input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    margin-bottom:16px;

    font-size:15px;

    outline:none;
}

input:focus{

    border-color:#6a11cb;

    box-shadow:
    0 0 0 3px rgba(106,17,203,.10);
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(135deg,#6a11cb,#2575fc);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

button:disabled{

    opacity:.6;
}

.secondary{

    margin-top:10px;

    background:#f1f3f5;

    color:#333;
}

.outline{

    margin-top:15px;

    background:white;

    color:#1d2671;

    border:1px solid #1d2671;
}

.links{

    text-align:center;

    margin-top:18px;
}

.links button{

    background:none;

    color:#2575fc;

    font-size:14px;

    padding:5px;

}

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:14px;
}

.message.success{

    display:block;

    background:#e8f8ee;

    color:#18743b;
}

.message.error{

    display:block;

    background:#fdecec;

    color:#b42318;
}

.back{

    margin-top:18px;

    text-align:center;
}

.back a{

    color:#1d2671;

    text-decoration:none;

    font-weight:bold;
}

.small{

    text-align:center;

    color:#777;

    font-size:13px;

    line-height:1.5;

    margin-bottom:15px;
}

@media(max-width:480px){

    body{

        padding:15px;

        align-items:flex-start;

        padding-top:25px;
    }

    .box{

        padding:28px 20px;
    }
}

</style>

</head>


<body>


<div class="box">


<div class="logo"
     id="academyLogo">

🎵

</div>


<div id="academyName"
     class="academy-name">

Music Academy

</div>


<div class="subtitle">

Student Portal

</div>


<!-- LOGIN -->

<div id="loginSection"
     class="section active">

<h2>Student Login</h2>


<div class="info">

Login using your Mobile Number
and 4-Digit PIN.

</div>


<form id="loginForm">


<label>Mobile Number</label>

<input type="tel"
       id="loginMobile"
       placeholder="Enter mobile number"
       maxlength="15"
       required>


<label>4-Digit PIN</label>

<input type="password"
       id="loginPin"
       placeholder="Enter 4-Digit PIN"
       maxlength="4"
       inputmode="numeric"
       required>


<button type="submit"
        id="loginBtn">

Login

</button>

</form>


<div class="links">

<button onclick="showCreatePin()">

First Login? Create PIN

</button>


<br>


<button onclick="showForgotPin()">

Forgot PIN

</button>

</div>

</div>


<!-- CREATE PIN -->

<div id="createPinSection"
     class="section">

<h2>Create PIN</h2>


<p class="small">

For first login, enter your registered
mobile number and create your own
4-digit PIN.

</p>


<input type="tel"
       id="createMobile"
       placeholder="Mobile Number"
       maxlength="15">


<input type="password"
       id="createPin"
       placeholder="Create 4-Digit PIN"
       maxlength="4"
       inputmode="numeric">


<input type="password"
       id="confirmCreatePin"
       placeholder="Confirm 4-Digit PIN"
       maxlength="4"
       inputmode="numeric">


<div id="createMessage"
     class="message">
</div>


<button onclick="createPin()">

CREATE PIN

</button>


<button
    class="secondary"
    onclick="showLogin()">

← Back to Login

</button>

</div>


<!-- FORGOT PIN -->

<div id="forgotPinSection"
     class="section">

<h2>Forgot PIN</h2>


<p class="small">

Verify your Mobile Number and
Date of Joining.

</p>


<input type="tel"
       id="forgotMobile"
       placeholder="Mobile Number"
       maxlength="15">


<input type="date"
       id="forgotJoiningDate">


<input type="password"
       id="forgotNewPin"
       placeholder="New 4-Digit PIN"
       maxlength="4"
       inputmode="numeric">


<input type="password"
       id="forgotConfirmPin"
       placeholder="Confirm New PIN"
       maxlength="4"
       inputmode="numeric">


<div id="forgotMessage"
     class="message">
</div>


<button onclick="resetPin()">

RESET PIN

</button>


<button
    class="secondary"
    onclick="showLogin()">

← Back to Login

</button>

</div>


<div class="back">

<a href="index.html">

← Back to Main Login

</a>

</div>


</div>


<script>


const loginForm=
    document.getElementById(
        "loginForm"
    );


const loginBtn=
    document.getElementById(
        "loginBtn"
    );


/* BRANDING */

async function loadStudentBranding(){

    const mobile=
        document.getElementById(
            "loginMobile"
        ).value.trim();

    if(!mobile)
        return;


    try{

        const {data,error}=
        await supabaseClient.rpc(
            "get_student_branding",
            {

                p_mobile:mobile

            }
        );


        if(error){

            console.log(error);

            return;
        }


        if(data){

            document.getElementById(
                "academyName"
            ).textContent=
                data.class_name ||
                "Music Academy";


            if(data.logo_url){

                document.getElementById(
                    "academyLogo"
                ).innerHTML=
                `<img src="${data.logo_url}"
                      alt="Academy Logo">`;
            }
        }

    }catch(err){

        console.log(err);

    }
}


document.getElementById(
    "loginMobile"
).addEventListener(
    "blur",
    loadStudentBranding
);


/* SECTIONS */

function hideSections(){

    document.querySelectorAll(
        ".section"
    ).forEach(el=>{

        el.classList.remove("active");

    });
}


function showLogin(){

    hideSections();

    document.getElementById(
        "loginSection"
    ).classList.add("active");
}


function showCreatePin(){

    hideSections();

    document.getElementById(
        "createPinSection"
    ).classList.add("active");

}


function showForgotPin(){

    hideSections();

    document.getElementById(
        "forgotPinSection"
    ).classList.add("active");

}


/* MESSAGE */

function showMessage(
    id,
    text,
    type
){

    const el=
        document.getElementById(id);

    el.textContent=text;

    el.className=
        "message "+type;
}


/* LOGIN */

loginForm.addEventListener(
"submit",
async function(e){

    e.preventDefault();


    const mobile=
        document.getElementById(
            "loginMobile"
        ).value.trim();


    const pin=
        document.getElementById(
            "loginPin"
        ).value.trim();


    if(
        !mobile ||
        !pin
    ){

        showMessage(
            "loginMessage",
            "Please enter Mobile Number and PIN.",
            "error"
        );

        return;
    }


    if(!/^\d{4}$/.test(pin)){

        alert(
            "PIN must be exactly 4 digits."
        );

        return;
    }


    loginBtn.disabled=true;

    loginBtn.textContent=
        "Checking...";


    try{

        const {data,error}=
        await supabaseClient.rpc(
            "verify_student_login",
            {

                p_mobile:mobile,

                p_pin:pin

            }
        );


        if(error)
            throw error;


        if(
            !data ||
            data.success!==true
        ){

            alert(
                data?.message ||
                "Login failed."
            );

            loginBtn.disabled=false;

            loginBtn.textContent=
                "Login";

            return;
        }


        /* SESSION */

        const student=
            data.student;


        const {
            data:sessionData,
            error:sessionError
        }=
        await supabaseClient.rpc(
            "create_student_session",
            {

                p_student_id:
                    student.id

            }
        );


        if(sessionError)
            throw sessionError;


        if(
            !sessionData ||
            !sessionData.success
        ){

            throw new Error(
                sessionData?.message ||
                "Student session could not be created."
            );
        }


        localStorage.setItem(
            "studentLogin",
            "true"
        );


        localStorage.setItem(
            "studentSessionToken",
            sessionData.token
        );


        localStorage.setItem(
            "studentData",
            JSON.stringify(student)
        );


        window.location.href=
            "student-dashboard.html";


    }catch(error){

        console.error(error);

        alert(
            error.message ||
            "Login failed."
        );

        loginBtn.disabled=false;

        loginBtn.textContent=
            "Login";
    }

});


/* CREATE PIN */

async function createPin(){

    const mobile=
        document.getElementById(
            "createMobile"
        ).value.trim();


    const pin=
        document.getElementById(
            "createPin"
        ).value.trim();


    const confirmPin=
        document.getElementById(
            "confirmCreatePin"
        ).value.trim();


    if(
        !mobile ||
        !pin ||
        !confirmPin
    ){

        showMessage(
            "createMessage",
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(!/^\d{4}$/.test(pin)){

        showMessage(
            "createMessage",
            "PIN must be exactly 4 digits.",
            "error"
        );

        return;
    }


    if(pin!==confirmPin){

        showMessage(
            "createMessage",
            "PINs do not match.",
            "error"
        );

        return;
    }


    try{

        const {data,error}=
        await supabaseClient.rpc(
            "create_student_pin",
            {

                p_mobile:mobile,

                p_pin:pin

            }
        );


        if(error)
            throw error;


        if(
            !data ||
            data.success!==true
        ){

            showMessage(
                "createMessage",
                data?.message ||
                "PIN could not be created.",
                "error"
            );

            return;
        }


        showMessage(
            "createMessage",
            "PIN created successfully. Please login.",
            "success"
        );


        document.getElementById(
            "loginMobile"
        ).value=mobile;


        setTimeout(()=>{

            showLogin();

        },1500);


    }catch(error){

        console.error(error);

        showMessage(
            "createMessage",
            error.message ||
            "PIN creation failed.",
            "error"
        );
    }
}


/* FORGOT PIN */

async function resetPin(){

    const mobile=
        document.getElementById(
            "forgotMobile"
        ).value.trim();


    const joiningDate=
        document.getElementById(
            "forgotJoiningDate"
        ).value;


    const newPin=
        document.getElementById(
            "forgotNewPin"
        ).value.trim();


    const confirmPin=
        document.getElementById(
            "forgotConfirmPin"
        ).value.trim();


    if(
        !mobile ||
        !joiningDate ||
        !newPin ||
        !confirmPin
    ){

        showMessage(
            "forgotMessage",
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(!/^\d{4}$/.test(newPin)){

        showMessage(
            "forgotMessage",
            "PIN must be exactly 4 digits.",
            "error"
        );

        return;
    }


    if(newPin!==confirmPin){

        showMessage(
            "forgotMessage",
            "PINs do not match.",
            "error"
        );

        return;
    }


    try{

        const {data,error}=
        await supabaseClient.rpc(
            "reset_student_pin",
            {

                p_mobile:mobile,

                p_joining_date:
                    joiningDate,

                p_new_pin:
                    newPin

            }
        );


        if(error)
            throw error;


        if(
            !data ||
            data.success!==true
        ){

            showMessage(
                "forgotMessage",
                data?.message ||
                "PIN could not be reset.",
                "error"
            );

            return;
        }


        showMessage(
            "forgotMessage",
            "PIN changed successfully. Please login.",
            "success"
        );


        document.getElementById(
            "loginMobile"
        ).value=mobile;


        setTimeout(()=>{

            showLogin();

        },1500);


    }catch(error){

        console.error(error);

        showMessage(
            "forgotMessage",
            error.message ||
            "PIN reset failed.",
            "error"
        );
    }
}


</script>

</body>

</html>
