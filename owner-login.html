<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Owner Login</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #1d2671,
            #c33764
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.container {

    width: 100%;

    max-width: 430px;
}

.card {

    background: white;

    border-radius: 25px;

    padding: 35px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.25);
}

.header {

    text-align: center;

    margin-bottom: 30px;
}

.logo {

    width: 90px;

    height: 90px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    background:
        linear-gradient(
            135deg,
            #1d2671,
            #c33764
        );

    color: white;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.18);

    overflow: hidden;
}

.logo img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}

.academy-name {

    margin-top: 18px;

    margin-bottom: 6px;

    color: #222;

    font-size: 28px;

    font-weight: bold;
}

.subtitle {

    color: #777;

    font-size: 15px;
}

h2 {

    text-align: center;

    color: #222;

    margin-top: 25px;

    margin-bottom: 25px;

    font-size: 24px;
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 7px;

    color: #222;

    font-size: 14px;

    font-weight: bold;
}

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    outline: none;
}

input:focus {

    border-color: #1d2671;

    box-shadow:
        0 0 0 2px
        rgba(29,38,113,0.08);
}

.pin-input {

    text-align: center;

    letter-spacing: 8px;

    font-size: 20px;
}

.remember {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 15px;

    color: #555;

    font-size: 14px;
}

.remember input {

    width: auto;
}

button {

    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 10px;

    margin-top: 20px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #1d2671,
            #c33764
        );

    transition: 0.2s;
}

button:hover {

    opacity: 0.9;

    transform: scale(1.02);
}

button:active {

    transform: scale(0.98);
}

button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}

.links {

    text-align: center;

    margin-top: 20px;
}

.links a {

    display: block;

    margin-top: 9px;

    color: #1d2671;

    text-decoration: none;

    font-size: 14px;

    cursor: pointer;
}

.links a:hover {

    color: #c33764;
}

.back-button {

    background: #eeeeee;

    color: #222;
}

.back-button:hover {

    background: #e5e5e5;

    color: #222;
}

.message {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;
}

.success {

    background: #e8f5e9;

    color: #2e7d32;
}

.error {

    background: #ffebee;

    color: #c62828;
}

.section {

    display: none;
}

.verified-box {

    text-align: center;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 10px;

    background: #e8f5e9;

    color: #2e7d32;

    font-weight: bold;
}

@media(max-width: 500px) {

    body {

        padding: 15px;

        align-items: flex-start;

        padding-top: 25px;
    }

    .card {

        padding: 28px 20px;

        border-radius: 20px;
    }

    .logo {

        width: 75px;

        height: 75px;

        font-size: 35px;
    }

    .academy-name {

        font-size: 24px;
    }

    h2 {

        font-size: 22px;
    }
}

</style>

</head>


<body>


<div class="container">


<!-- ================================================= -->
<!-- LOGIN -->
<!-- ================================================= -->

<div class="card" id="loginSection">

    <div class="header">

        <div class="logo" id="logoBox">

            🎵

        </div>

        <div
            class="academy-name"
            id="academyName"
        >

            Music Academy

        </div>

        <div class="subtitle">

            Owner Login

        </div>

    </div>


    <h2>

        🔐 Owner Login

    </h2>


    <label>

        Email Address

    </label>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter owner email"
        autocomplete="email"
    >


    <label>

        Password

    </label>

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
        autocomplete="current-password"
    >


    <label>

        4-Digit PIN

    </label>

    <input
        type="password"
        id="loginPin"
        class="pin-input"
        placeholder="••••"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
    >


    <div class="remember">

        <input
            type="checkbox"
            id="rememberMe"
            checked
        >

        <span>
            Remember me on this device
        </span>

    </div>


    <button
        id="loginButton"
        onclick="ownerLogin()"
    >

        LOGIN

    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>


    <div class="links">

        <a onclick="showForgotPassword()">
            Forgot Password?
        </a>

        <a onclick="showForgotPin()">
            Forgot PIN?
        </a>

    </div>


    <button
        class="back-button"
        onclick="goBack()"
    >

        ← Back

    </button>

</div>



<!-- ================================================= -->
<!-- FORGOT PASSWORD -->
<!-- ================================================= -->

<div
    class="card section"
    id="forgotPasswordSection"
>

    <div class="header">

        <div class="logo">

            🔑

        </div>

        <div class="academy-name">

            Forgot Password

        </div>

        <div class="subtitle">

            Owner Account Recovery

        </div>

    </div>


    <!-- VERIFICATION STEP -->

    <div id="passwordVerificationStep">

            🔐 Verify Account

        </h2>


        <label>

            Owner Email

        </label>

        <input

        >


        <label id="forgotPasswordBirthDateLabel">

            Owner Birth Date

        </label>

        <input
            type="date"
            id="forgotPasswordBirthDate"
        >


        <button
            id="verifyPasswordButton"

<!-- FORGOT PIN -->
<!-- ================================================= -->

<div
    class="card section"
    id="forgotPinSection"
>

    <div class="header">

        <div class="logo">

            🔢

        </div>

        <div class="academy-name">

            Forgot PIN

        <div class="subtitle">

            Owner PIN Recovery

        </div>

    </div>

            Owner Email

<script>


// =================================================
// VARIABLES
// =================================================

let recoveryVerifiedEmail = "";



// =================================================
// PAGE LOAD
// =================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        setupPinInputs();

        loadBranding();

        checkRememberedLogin();

    }
);



// =================================================
// BRANDING
// =================================================

async function loadBranding() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    if (!email) {

        return;

    }


    try {

        const { data, error } =
            await supabaseClient.rpc(
                "get_owner_branding",
                {
                    p_email: email
                }
            );


        if (error) {

            console.log(
                "Branding error:",
                error
            );

            return;

        }


        if (data && data.success) {

            document
                .getElementById("academyName")
                .textContent =
                    data.class_name ||
                    "Music Academy";


            if (data.logo_url) {

                document
                    .getElementById("logoBox")
                    .innerHTML =
                    `
                    <img
                        src="${data.logo_url}"
                        alt="Logo"
                    >
                    `;

            }

        }

    }
    catch (error) {

        console.log(error);

    }

}


document
    .getElementById("loginEmail")
    .addEventListener(
        "blur",
        loadBranding
    );



// =================================================
// REMEMBERED LOGIN
// =================================================

async function checkRememberedLogin() {

    const saved =
        localStorage.getItem(
            "ownerLogin"
        );


    if (!saved) {

        return;

    }


    try {

        const owner =
            JSON.parse(saved);


        if (!owner.email) {

            return;

        }


        const { data } =
            await supabaseClient
                .auth
                .getSession();


        if (data.session) {

            window.location.href =
                "owner-dashboard.html";

        }

    }
    catch (error) {

        localStorage.removeItem(
            "ownerLogin"
        );

    }

}



// =================================================
// OWNER LOGIN
// =================================================

async function ownerLogin() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const pin =
        document
            .getElementById("loginPin")
            .value
            .trim();


    const remember =
        document
            .getElementById("rememberMe")
            .checked;


    if (!email) {

        showMessage(
            "loginMessage",
            "Please enter email.",
            "error"
        );

        return;

    }


    if (!password) {

        showMessage(
            "loginMessage",
            "Please enter password.",
            "error"
        );

        return;

    }


    if (!/^\d{4}$/.test(pin)) {

        showMessage(
            "loginMessage",
            "PIN must be exactly 4 digits.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById("loginButton");


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showMessage(
                "loginMessage",
                error.message,
                "error"
            );

            button.disabled = false;

            button.textContent =
                "LOGIN";

            return;

        }


        const user =
            data.user;


        if (!user) {

            throw new Error(
                "Owner account not found."
            );

        }


        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select("id, role")
            .eq("id", user.id)
            .maybeSingle();


        if (
            profileError ||
            !profile ||
            String(profile.role)
                .toLowerCase() !== "owner"
        ) {

            await supabaseClient
                .auth
                .signOut();


            showMessage(
                "loginMessage",
                "This account is not an Owner account.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "LOGIN";

            return;

        }


        const {
            data: pinResult,
            error: pinError
        } =
        await supabaseClient.rpc(
            "check_owner_pin",
            {
                p_pin: pin
            }
        );


        if (pinError) {

            await supabaseClient
                .auth
                .signOut();


            showMessage(
                "loginMessage",
                "PIN verification failed.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "LOGIN";

            return;

        }


        let pinCorrect = false;


        if (
            typeof pinResult === "boolean"
        ) {

            pinCorrect =
                pinResult;

        }
        else if (
            pinResult &&
            typeof pinResult === "object"
        ) {

            pinCorrect =
                pinResult.success === true ||
                pinResult.valid === true ||
                pinResult.correct === true;

        }


        if (!pinCorrect) {

            await supabaseClient
                .auth
                .signOut();


            showMessage(
                "loginMessage",
                "Incorrect 4-digit PIN.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "LOGIN";

            return;

        }


        if (remember) {

            localStorage.setItem(
                "ownerLogin",
                JSON.stringify({

                    id:
                        user.id,

                    email:
                        email,

                    role:
                        "owner"

                })
            );

        }
        else {

            localStorage.removeItem(
                "ownerLogin"
            );

        }


        showMessage(
            "loginMessage",
            "Login successful.",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "owner-dashboard.html";

            },
            500
        );

    }
    catch (error) {

        console.error(error);


        showMessage(
            "loginMessage",
            error.message ||
            "Login failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

}



// =================================================
// SHOW FORGOT PASSWORD
// =================================================

function showForgotPassword() {

    hideAllSections();


    document
        .getElementById("forgotPasswordSection")
        .style.display =
        "block";


    resetPasswordRecoveryUI();

}



// =================================================
// VERIFY PASSWORD RECOVERY
// =================================================

async function verifyPasswordRecovery() {

    const email =
        document
            .getElementById("forgotPasswordEmail")
            .value
            .trim();


    const birthDate =
        document
            .getElementById("forgotPasswordBirthDate")
            .value;


    if (!email || !birthDate) {

        showMessage(
            "passwordVerifyMessage",
            "Please enter email and birth date.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "verifyPasswordButton"
            );


    button.disabled = true;

    button.textContent =
        "VERIFYING...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "verify_owner_recovery",
            {
                p_email:
                    email,

                p_birth_date:
                    birthDate
            }
        );


        if (error) {

            throw error;

        }


        let verified = false;


        if (
            typeof data === "boolean"
        ) {

            verified =
                data;

        }
        else if (data) {

            verified =
                data.success === true ||
                data.verified === true;

        }


        if (!verified) {

            showMessage(
                "passwordVerifyMessage",
                "Email or birth date is incorrect.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "VERIFY";

            return;

        }


        // SAVE VERIFIED EMAIL

        recoveryVerifiedEmail =
            email;


        // HIDE VERIFICATION STEP

        document
            .getElementById(
                "passwordVerificationStep"
            )
            .style.display =
            "none";


        // SHOW PASSWORD CHANGE

        document
            .getElementById(
                "newPasswordBox"
            )
            .style.display =
            "block";


        showMessage(
            "passwordVerifyMessage",
            "Verified successfully.",
            "success"
        );

    }
    catch (error) {

        console.error(error);


        showMessage(
            "passwordVerifyMessage",
            error.message ||
            "Verification failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "VERIFY";

    }

}



// =================================================
// RESET PASSWORD
// =================================================

async function resetPassword() {

    const password =
        document
            .getElementById("newPassword")
            .value;


    const confirm =
        document
            .getElementById("confirmPassword")
            .value;


    if (!recoveryVerifiedEmail) {

        showMessage(
            "passwordResetMessage",
            "Please verify your account first.",
            "error"
        );

        return;

    }


    if (!password || !confirm) {

        showMessage(
            "passwordResetMessage",
            "Please enter both passwords.",
            "error"
        );

        return;

    }


    if (password !== confirm) {

        showMessage(
            "passwordResetMessage",
            "Passwords do not match.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "passwordResetMessage",
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "savePasswordButton"
            );


    button.disabled = true;

    button.textContent =
        "SAVING...";


    try {

        /*
         * Password reset is handled
         * by the existing Edge Function.
         *
         * We use the same Supabase
         * project URL from supabase.js.
         */

        const SUPABASE_URL =
            "https://ehchhgqjohsdkxmouozm.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_41E2ivZKj4l5YfIpoCzwHA_MjyQAHfq";


        const response =
            await fetch(
                `${SUPABASE_URL}/functions/v1/owner-reset-password`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY

                    },

                    body:
                        JSON.stringify({

                            email:
                                recoveryVerifiedEmail,

                            new_password:
                                password

                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Password reset failed."
            );

        }


        showMessage(
            "passwordResetMessage",
            "Password changed successfully.",
            "success"
        );


        button.textContent =
            "PASSWORD SAVED";


        setTimeout(
            function () {

                showLogin();

            },
            1200
        );

    }
    catch (error) {

        console.error(error);


        showMessage(
            "passwordResetMessage",
            error.message ||
            "Password reset failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "SAVE PASSWORD";

    }

}



// =================================================
// SHOW FORGOT PIN
// =================================================

function showForgotPin() {

    hideAllSections();


    document
        .getElementById("forgotPinSection")
        .style.display =
        "block";


    resetPinRecoveryUI();

}



// =================================================
// VERIFY PIN RECOVERY
// =================================================

async function verifyPinRecovery() {

    const email =
        document
            .getElementById("forgotPinEmail")
            .value
            .trim();


    const birthDate =
        document
            .getElementById("forgotPinBirthDate")
            .value;


    if (!email || !birthDate) {

        showMessage(
            "pinVerifyMessage",
            "Please enter email and birth date.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "verifyPinButton"
            );


    button.disabled = true;

    button.textContent =
        "VERIFYING...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "verify_owner_recovery",
            {

                p_email:
                    email,

                p_birth_date:
                    birthDate

            }
        );


        if (error) {

            throw error;

        }


        let verified = false;


        if (
            typeof data === "boolean"
        ) {

            verified =
                data;

        }
        else if (data) {

            verified =
                data.success === true ||
                data.verified === true;

        }


        if (!verified) {

            showMessage(
                "pinVerifyMessage",
                "Email or birth date is incorrect.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "VERIFY";

            return;

        }


        recoveryVerifiedEmail =
            email;


        // HIDE ENTIRE VERIFICATION STEP

        document
            .getElementById(
                "pinVerificationStep"
            )
            .style.display =
            "none";


        // SHOW NEW PIN

        document
            .getElementById(
                "newPinBox"
            )
            .style.display =
            "block";


        showMessage(
            "pinVerifyMessage",
            "Verified successfully.",
            "success"
        );

    }
    catch (error) {

        console.error(error);


        showMessage(
            "pinVerifyMessage",
            error.message ||
            "Verification failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "VERIFY";

    }

}



// =================================================
// RESET PIN
// =================================================

async function resetPin() {

    const newPin =
        document
            .getElementById("newPin")
            .value
            .trim();


    const confirmPin =
        document
            .getElementById("confirmPin")
            .value
            .trim();


    if (!recoveryVerifiedEmail) {

        showMessage(
            "pinResetMessage",
            "Please verify your account first.",
            "error"
        );

        return;

    }


    if (!/^\d{4}$/.test(newPin)) {

        showMessage(
            "pinResetMessage",
            "PIN must be exactly 4 digits.",
            "error"
        );

        return;

    }


    if (newPin !== confirmPin) {

        showMessage(
            "pinResetMessage",
            "PINs do not match.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "savePinButton"
            );


    button.disabled = true;

    button.textContent =
        "SAVING...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "reset_owner_pin",
            {

                p_email:
                    recoveryVerifiedEmail,

                p_pin:
                    newPin

            }
        );


        if (error) {

            throw error;

        }


        let success = false;


        if (
            typeof data === "boolean"
        ) {

            success =
                data;

        }
        else if (data) {

            success =
                data.success === true ||
                data.updated === true;

        }


        if (!success) {

            throw new Error(
                "PIN reset failed."
            );

        }


        showMessage(
            "pinResetMessage",
            "PIN changed successfully.",
            "success"
        );


        button.textContent =
            "PIN SAVED";


        setTimeout(
            function () {

                showLogin();

            },
            1200
        );

    }
    catch (error) {

        console.error(error);


        showMessage(
            "pinResetMessage",
            error.message ||
            "PIN reset failed.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "SAVE PIN";

    }

}

// =================================================
// PIN INPUT
// =================================================

function setupPinInputs() {

    const inputs =
        document.querySelectorAll(
            ".pin-input"
        );


    inputs.forEach(
        function(input) {

            input.addEventListener(
                "input",
                function() {

                    this.value =
                        this.value
                            .replace(/\D/g, "")
                            .slice(0, 4);

                }
            );

        }
    );

}
