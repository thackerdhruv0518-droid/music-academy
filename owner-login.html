<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login - Music Academy</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR SUPABASE CONFIG -->
  <script src="supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #1d2671,
          #c33764
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      min-height: 650px;

      background: white;

      border-radius: 25px;

      overflow: hidden;

      display: grid;

      grid-template-columns: 45% 55%;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.25);
    }

    /* LEFT */

    .left {

      background:
        linear-gradient(
          160deg,
          #171d4f,
          #7b2355
        );

      color: white;

      padding: 55px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .logo {

      width: 90px;
      height: 90px;

      background:
        rgba(255,255,255,0.15);

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 45px;

      margin-bottom: 25px;
    }

    .left h1 {

      font-size: 38px;

      margin-bottom: 12px;
    }

    .left p {

      color: #dddddd;

      line-height: 1.6;

      margin-bottom: 30px;
    }

    .features {

      color: #eeeeee;

      line-height: 2.3;

      font-size: 15px;
    }

    /* RIGHT */

    .right {

      padding: 55px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .right h2 {

      font-size: 32px;

      color: #222;

      margin-bottom: 8px;
    }

    .subtitle {

      color: #777;

      margin-bottom: 30px;
    }

    label {

      display: block;

      margin-bottom: 8px;

      font-weight: bold;

      color: #333;
    }

    input {

      width: 100%;

      padding: 14px 15px;

      border: 1px solid #dddddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      margin-bottom: 20px;
    }

    input:focus {

      border-color: #6c63ff;

      box-shadow:
        0 0 0 3px
        rgba(108,99,255,0.10);
    }

    /* PIN */

    #pin {

      text-align: center;

      letter-spacing: 10px;

      font-size: 25px;

      font-weight: bold;
    }

    /* REMEMBER */

    .remember-row {

      display: flex;

      align-items: center;

      gap: 9px;

      margin-top: -5px;

      margin-bottom: 15px;

      font-weight: normal;

      color: #555;

      cursor: pointer;
    }

    .remember-row input {

      width: 18px;
      height: 18px;

      margin: 0;

      cursor: pointer;
    }

    /* BUTTON */

    button {

      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #1d2671,
          #c33764
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 5px;

      transition: 0.2s;
    }

    button:hover {

      opacity: 0.92;

      transform: translateY(-1px);
    }

    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    /* MESSAGE */

    #message {

      margin-top: 18px;

      padding: 12px;

      border-radius: 8px;

      display: none;

      text-align: center;

      font-size: 14px;
    }

    .error {

      display: block !important;

      background: #ffe5e5;

      color: #c62828;
    }

    .success {

      display: block !important;

      background: #e5f8ea;

      color: #16803c;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      .container {

        grid-template-columns: 1fr;
      }

      .left {

        display: none;
      }

      .right {

        padding: 35px 25px;
      }
    }

  </style>

</head>


<body>


  <div class="container">


    <!-- LEFT SIDE -->

    <div class="left">

      <div class="logo">
        🎵
      </div>

      <h1>
        Music Academy
      </h1>

      <p>
        Owner Management Portal
      </p>

      <div class="features">

        ✓ Student Management<br>

        ✓ Fees Management<br>

        ✓ Fee Receipts<br>

        ✓ Batch Management<br>

        ✓ Academy Settings

      </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right">


      <h2>
        Owner Login
      </h2>


      <p class="subtitle">
        Login to your Owner Dashboard
      </p>


      <!-- EMAIL -->

      <label for="email">
        Owner Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter owner email"
        autocomplete="username"
      >


      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >


      <!-- PIN -->

      <label for="pin">
        4-Digit Owner PIN
      </label>

      <input
        type="password"
        id="pin"
        placeholder="••••"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
      >


      <!-- REMEMBER ME -->

      <label class="remember-row">

        <input
          type="checkbox"
          id="rememberMe"
          checked
        >

        <span>
          Remember Me
        </span>

      </label>


      <!-- BUTTON -->

      <button id="loginBtn">

        Login

      </button>


      <!-- MESSAGE -->

      <div id="message"></div>


    </div>

  </div>


<script>


  // ==========================================
  // ELEMENTS
  // ==========================================

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const pinInput =
    document.getElementById("pin");

  const rememberInput =
    document.getElementById("rememberMe");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  // ==========================================
  // SHOW MESSAGE
  // ==========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className = "";

    message.classList.add(type);

  }


  // ==========================================
  // PIN ONLY NUMBERS
  // ==========================================

  pinInput.addEventListener(
    "input",
    function () {

      this.value =
        this.value
          .replace(/\D/g, "")
          .slice(0, 4);

    }
  );


  // ==========================================
  // CHECK REMEMBERED LOGIN
  // ==========================================

  async function checkRememberedLogin() {

    try {

      const remembered =
        localStorage.getItem(
          "owner_remember_me"
        ) === "true";


      const currentSession =
        sessionStorage.getItem(
          "owner_session_active"
        ) === "true";


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        return;

      }


      if (
        data &&
        data.session &&
        (
          remembered ||
          currentSession
        )
      ) {

        window.location.href =
          "dashboard.html";

        return;

      }


      if (
        data &&
        data.session &&
        !remembered &&
        !currentSession
      ) {

        await supabaseClient
          .auth
          .signOut();

      }

    }
    catch (error) {

      console.error(
        "Session check error:",
        error
      );

    }

  }


  // ==========================================
  // SAVE REMEMBER OPTION
  // ==========================================

  function saveRememberOption() {

    sessionStorage.setItem(
      "owner_session_active",
      "true"
    );


    if (
      rememberInput.checked
    ) {

      localStorage.setItem(
        "owner_remember_me",
        "true"
      );

    }
    else {

      localStorage.removeItem(
        "owner_remember_me"
      );

    }

  }


  // ==========================================
  // CREATE OWNER PROFILE
  // ==========================================

  async function createOwnerProfile(user) {


    const {
      data: existingProfile,
      error: profileCheckError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id, full_name, role"
        )
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if (profileCheckError) {

      console.error(
        "Profile check error:",
        profileCheckError
      );

      throw new Error(
        "Could not check Owner profile."
      );

    }


    // PROFILE ALREADY EXISTS

    if (existingProfile) {

      if (
        existingProfile.role !== "owner"
      ) {

        throw new Error(
          "This account is not an Owner account."
        );

      }

      return existingProfile;

    }


    // CREATE OWNER PROFILE

    const {
      data: newProfile,
      error: profileInsertError
    } =
      await supabaseClient
        .from("profiles")
        .insert({

          id: user.id,

          full_name:
            user.email
              ? user.email.split("@")[0]
              : "Owner",

          role: "owner"

        })
        .select(
          "id, full_name, role"
        )
        .single();


    if (profileInsertError) {

      console.error(
        "Profile insert error:",
        profileInsertError
      );

      throw new Error(
        "Could not create Owner profile."
      );

    }


    return newProfile;

  }


  // ==========================================
  // CREATE / UPDATE OWNER PIN
  // ==========================================

  async function createOwnerPIN(pin) {


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "set_owner_pin",
        {
          p_pin: pin
        }
      );


    if (error) {

      console.error(
        "PIN save error:",
        error
      );

      throw new Error(
        error.message ||
        "Could not save Owner PIN."
      );

    }


    if (data !== true) {

      throw new Error(
        "Owner PIN could not be saved."
      );

    }


    return true;

  }


  // ==========================================
  // CHECK OWNER PIN
  // ==========================================

  async function checkOwnerPIN(pin) {


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "check_owner_pin",
        {
          p_pin: pin
        }
      );


    if (error) {

      console.error(
        "PIN check error:",
        error
      );

      throw new Error(
        error.message ||
        "PIN verification failed."
      );

    }


    return data === true;

  }


  // ==========================================
  // OWNER LOGIN
  // ==========================================

  async function ownerLogin() {


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const pin =
      pinInput.value.trim();


    // ========================================
    // VALIDATION
    // ========================================

    if (!email) {

      showMessage(
        "Please enter owner email.",
        "error"
      );

      return;

    }


    if (!password) {

      showMessage(
        "Please enter password.",
        "error"
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    if (!/^\d{4}$/.test(pin)) {

      showMessage(
        "Please enter a valid 4-digit PIN.",
        "error"
      );

      return;

    }


    // ========================================
    // LOADING
    // ========================================

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Please wait...";

    message.className = "";


    try {


      // ======================================
      // STEP 1
      // LOGIN
      // ======================================

      const {
        data: loginData,
        error: loginError
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      // ======================================
      // EXISTING OWNER LOGIN
      // ======================================

      if (
        !loginError &&
        loginData &&
        loginData.user
      ) {


        const user =
          loginData.user;


        // ------------------------------------
        // GET PROFILE
        // ------------------------------------

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id, full_name, role"
            )
            .eq(
              "id",
              user.id
            )
            .single();


        if (
          profileError ||
          !profile
        ) {

          await supabaseClient
            .auth
            .signOut();

          throw new Error(
            "Owner profile not found."
          );

        }


        // ------------------------------------
        // OWNER CHECK
        // ------------------------------------

        if (
          profile.role !== "owner"
        ) {

          await supabaseClient
            .auth
            .signOut();

          throw new Error(
            "This account is not an Owner account."
          );

        }


        // ------------------------------------
        // CHECK CURRENT PIN
        // ------------------------------------

        const pinCorrect =
          await checkOwnerPIN(pin);


        // ====================================
        // TEMPORARY PIN FIX
        // ====================================

        if (!pinCorrect) {

          loginBtn.textContent =
            "Setting Owner PIN...";


          /*
            TEMPORARY SETUP:

            If the entered PIN is wrong,
            save the entered PIN as the
            new Owner PIN.

            This is only for getting
            the Owner to Dashboard.
          */

          await createOwnerPIN(pin);


          showMessage(
            "Owner PIN updated successfully! Opening Dashboard...",
            "success"
          );

        }
        else {

          showMessage(
            "Login successful! Opening Dashboard...",
            "success"
          );

        }


        // ------------------------------------
        // SAVE REMEMBER
        // ------------------------------------

        saveRememberOption();


        // ------------------------------------
        // OPEN DASHBOARD
        // ------------------------------------

        setTimeout(
          function () {

            window.location.href =
              "dashboard.html";

          },
          700
        );


        return;

      }


      // ======================================
      // NEW OWNER ACCOUNT
      // ======================================

      loginBtn.textContent =
        "Creating Owner Account...";


      const {
        data: signupData,
        error: signupError
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password

        });


      // ======================================
      // SIGNUP ERROR
      // ======================================

      if (signupError) {

        console.error(
          "Signup error:",
          signupError
        );


        if (
          signupError.message
            .toLowerCase()
            .includes("already registered")
        ) {

          throw new Error(
            "Account already exists. Please check your email and password."
          );

        }


        throw new Error(
          signupError.message
        );

      }


      // ======================================
      // USER CHECK
      // ======================================

      if (
        !signupData ||
        !signupData.user
      ) {

        throw new Error(
          "Owner account could not be created."
        );

      }


      // ======================================
      // SESSION CHECK
      // ======================================

      if (!signupData.session) {

        throw new Error(
          "Account created, but email confirmation is ON. Please turn Confirm email OFF in Supabase."
        );

      }


      // ======================================
      // CREATE PROFILE
      // ======================================

      loginBtn.textContent =
        "Creating Owner Profile...";


      await createOwnerProfile(
        signupData.user
      );


      // ======================================
      // SAVE OWNER PIN
      // ======================================

      loginBtn.textContent =
        "Saving Owner PIN...";


      await createOwnerPIN(pin);


      // ======================================
      // SAVE REMEMBER
      // ======================================

      saveRememberOption();


      // ======================================
      // SUCCESS
      // ======================================

      showMessage(
        "Owner account created successfully! Opening Dashboard...",
        "success"
      );


      setTimeout(
        function () {

          window.location.href =
            "dashboard.html";

        },
        700
      );


    }
    catch (error) {


      console.error(
        "Owner Login Error:",
        error
      );


      showMessage(
        error.message ||
        "Login failed.",
        "error"
      );


      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }

  }


  // ==========================================
  // LOGIN BUTTON
  // ==========================================

  loginBtn.addEventListener(
    "click",
    ownerLogin
  );


  // ==========================================
  // ENTER KEY
  // ==========================================

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        ownerLogin();

      }

    }
  );


  // ==========================================
  // START
  // ==========================================

  checkRememberedLogin();


</script>


</body>

</html>
