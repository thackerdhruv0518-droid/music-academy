<style>

*{

}

body{

    width:100%;

}

.academy-name{

    color:#222;
}

.subtitle{

    font-size:15px;
}

h2{

    text-align:center;

    color:#222;

    margin:25px 0;
}

label{

    display:block;

    margin-top:15px;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#222;
}

input{

    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    outline:none;
}

input:focus{

    border-color:#1d2671;
}

.pin-input{

    text-align:center;

    letter-spacing:8px;

    font-size:20px;
}

.remember{

    display:flex;

    gap:8px;

    margin-top:15px;

    color:#555;

    font-size:14px;
}

.remember input{

    width:auto;
}

button{

    width:100%;

    padding:14px;

    margin-top:20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #1d2671,
        #c33764
    );
}

button:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.back-button{

    background:#eeeeee;

    color:#222;
}

.links{

    text-align:center;

    margin-top:20px;
}

.links a{

    display:block;

    margin-top:10px;

    color:#1d2671;

    font-size:14px;

    cursor:pointer;

    text-decoration:none;
}

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    text-align:center;

    font-size:14px;
}

.success{

    background:#e8f5e9;

    color:#2e7d32;
}

.error{

    background:#ffebee;

    color:#c62828;
}

.section{

    display:none;
}

.verified-box{

    text-align:center;

    padding:12px;

    border-radius:10px;

    background:#e8f5e9;

    color:#2e7d32;

    font-weight:bold;
}

@media(max-width:500px){

    }

    .logo{

        width:75px;

        height:75px;
    }

    .academy-name{

        font-size:24px;
    }
}

</style>

</head>


<body>

<script>


// =================================================
// VARIABLES
// =================================================

let recoveryVerifiedEmail = "";

let recoveryVerifiedBirthDate = "";



// =================================================
// PAGE LOAD
// =================================================

document.addEventListener(
"DOMContentLoaded",
function(){

setupPinInputs();

loadBranding();

checkRememberedLogin();

});



// =================================================
// BRANDING
// =================================================

async function loadBranding(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

if(!email){

return;

}

try{

const {
data,
error
} =
await supabaseClient.rpc(
"get_owner_branding",
{
p_email:email
}
);

if(error){

console.log(error);

return;

}

if(data && data.success){

document
.getElementById("academyName")
.textContent =
data.class_name ||
"Music Academy";

if(data.logo_url){

document
.getElementById("logoBox")
.innerHTML =
`
<img
src="${data.logo_url}"
alt="Logo">
`;

}

}

}
catch(error){

console.log(error);

}

}


document
.getElementById("loginEmail")
.addEventListener(
"blur",
loadBranding
);



// =================================================
// REMEMBER LOGIN
// =================================================

async function checkRememberedLogin(){

const saved =
localStorage.getItem(
"ownerLogin"
);

if(!saved){

return;

}

try{

const {
data
} =
await supabaseClient
.auth
.getSession();

if(data.session){

window.location.href =
"dashboard.html";

}

}
catch(error){

localStorage.removeItem(
"ownerLogin"
);

}

}



// =================================================
// OWNER LOGIN
// =================================================

async function ownerLogin(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const pin =
document
.getElementById("loginPin")
.value
.trim();

const remember =
document
.getElementById("rememberMe")
.checked;


if(!email){

showMessage(
"loginMessage",
"Please enter email.",
"error"
);

return;

}


if(!password){

showMessage(
"loginMessage",
"Please enter password.",
"error"
);

return;

}


if(!/^\d{4}$/.test(pin)){

showMessage(
"loginMessage",
"PIN must be exactly 4 digits.",
"error"
);

return;

}


const button =
document
.getElementById("loginButton");

button.disabled = true;

button.textContent =
"LOGGING IN...";


try{


const {
data,
error
} =
await supabaseClient
.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}


const user =
data.user;


if(!user){

throw new Error(
"Owner account not found."
);

}


const {
data:profile,
error:profileError
} =
await supabaseClient
.from("profiles")
.select("id,role")
.eq("id",user.id)
.maybeSingle();


if(
profileError ||
!profile ||
String(profile.role)
.toLowerCase() !== "owner"
){

await supabaseClient
.auth
.signOut();

throw new Error(
"This account is not an Owner account."
);

}


const {
data:pinResult,
error:pinError
} =
await supabaseClient.rpc(
"check_owner_pin",
{
p_pin:pin
}
);


if(pinError){

throw pinError;

}


let pinCorrect = false;


if(typeof pinResult === "boolean"){

pinCorrect =
pinResult;

}
else if(pinResult){

pinCorrect =
pinResult.success === true ||
pinResult.valid === true ||
pinResult.correct === true;

}


if(!pinCorrect){

await supabaseClient
.auth
.signOut();

throw new Error(
"Incorrect 4-digit PIN."
);

}


if(remember){

localStorage.setItem(
"ownerLogin",
JSON.stringify({

id:user.id,

email:email,

role:"owner"

})
);

}
else{

localStorage.removeItem(
"ownerLogin"
);

}


showMessage(
"loginMessage",
"Login successful.",
"success"
);


setTimeout(
function(){

/*
 * IMPORTANT:
 * Dashboard file name is
 * dashboard.html
 */

window.location.href =
"dashboard.html";

},
500
);


}
catch(error){

console.error(error);


showMessage(
"loginMessage",
error.message ||
"Login failed.",
"error"
);


button.disabled = false;

button.textContent =
"LOGIN";

}

}

// FORGOT PASSWORD
// =================================================

function showForgotPassword(){

hideAllSections();

document

resetPasswordRecoveryUI();

// =================================================
// VERIFY PASSWORD
// =================================================

async function verifyPasswordRecovery(){

const email =
document
.getElementById(
"forgotPasswordEmail"
)
.value
.trim();

const birthDate =
document
.getElementById(
"forgotPasswordBirthDate"
)
.value;


if(!email || !birthDate){

showMessage(
"passwordVerifyMessage",
"Please enter email and birth date.",
"error"
);

return;

}


const button =
document
.getElementById(
"verifyPasswordButton"
);

button.disabled = true;

button.textContent =
"VERIFYING...";


try{

const {
data,
error
} =
await supabaseClient.rpc(
"verify_owner_recovery",
{

p_email:email,

p_birth_date:birthDate

}
);


if(error){

throw error;

}


let verified = false;


if(typeof data === "boolean"){

verified =
data;

}
else if(data){

verified =
data.success === true ||
data.verified === true;

}


if(!verified){

throw new Error(
"Email or birth date is incorrect."
);

}


recoveryVerifiedEmail =
email;

recoveryVerifiedBirthDate =
birthDate;


/*
 * IMPORTANT:
 * Hide the complete verification
 * section after successful verification.
 */

document
.getElementById(
"passwordVerificationStep"
)
.style.display =
"none";


document
.getElementById(
"newPasswordBox"
)
.style.display =
"block";


}
catch(error){

console.error(error);


showMessage(
"passwordVerifyMessage",
error.message ||
"Verification failed.",
"error"
);


button.disabled = false;

button.textContent =
"VERIFY";

}

}



// =================================================
// RESET PASSWORD
// =================================================

async function resetPassword(){

const password =
document
.getElementById(
"newPassword"
)
.value;

const confirm =
document
.getElementById(
"confirmPassword"
)
.value;


if(!recoveryVerifiedEmail){

showMessage(
"passwordResetMessage",
"Please verify your account first.",
"error"
);

return;

}


if(!recoveryVerifiedBirthDate){

showMessage(
"passwordResetMessage",
"Birth Date verification is missing.",
"error"
);

return;

}


if(!password || !confirm){

showMessage(
"passwordResetMessage",
"Please enter both passwords.",
"error"
);

return;

}


if(password !== confirm){

showMessage(
"passwordResetMessage",
"Passwords do not match.",
"error"
);

return;

}


if(password.length < 6){

showMessage(
"passwordResetMessage",
"Password must be at least 6 characters.",
"error"
);

return;

}


const button =
document
.getElementById(
"savePasswordButton"
);

button.disabled = true;

button.textContent =
"SAVING...";


try{


const SUPABASE_URL =
"https://ehchhgqjohsdkxmouozm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_41E2ivZKj4l5YfIpoCzwHA_MjyQAHfq";


const response =
await fetch(
`${SUPABASE_URL}/functions/v1/owner-reset-password`,
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY

},

body:
JSON.stringify({

email:
recoveryVerifiedEmail,

birth_date:
recoveryVerifiedBirthDate,

new_password:
password

})

}
);


const result =
await response.json();


if(!response.ok){

throw new Error(
result.message ||
"Password reset failed."
);

}


if(result.success === false){

throw new Error(
result.message ||
"Password reset failed."
);

}


showMessage(
"passwordResetMessage",
"Password changed successfully.",
"success"
);


button.textContent =
"PASSWORD SAVED";


setTimeout(
function(){

showLogin();

},
1200
);


}
catch(error){

console.error(error);


showMessage(
"passwordResetMessage",
error.message ||
"Password reset failed.",
"error"
);


button.disabled = false;

button.textContent =
"SAVE PASSWORD";

}

}

// =================================================
// MESSAGE
// =================================================

function showMessage(
elementId,
message,
type
){

document.getElementById(
elementId
);

element.textContent =
message;

element.className =
"message " + type;

element.style.display =
"block";

}



// =================================================
// PIN INPUT
// =================================================

function setupPinInputs(){

const inputs =
document.querySelectorAll(
".pin-input"
);


inputs.forEach(
function(input){

input.addEventListener(
"input",
function(){

this.value =
