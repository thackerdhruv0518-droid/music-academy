<script>
async function studentLogin() {

    const mobile = document
        .getElementById("loginMobile")
        .value
        .trim();

    const pin = document
        .getElementById("loginPin")
        .value
        .trim();

    if (!mobile || !pin) {
        showMessage(
            "loginMessage",
            "Please enter mobile number and PIN.",
            "error"
        );
        return;
    }

    if (!/^\d{4}$/.test(pin)) {
        showMessage(
            "loginMessage",
            "PIN must be exactly 4 digits.",
            "error"
        );
        return;
    }

    const button = document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    try {

        console.log("Student login started");
        console.log("Mobile:", mobile);

        const { data, error } =
            await supabaseClient.rpc(
                "verify_student_login",
                {
                    p_mobile: mobile,
                    p_pin: pin
                }
            );

        console.log("RPC DATA:", data);
        console.log("RPC ERROR:", error);

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                "No response received from student login."
            );
        }

        /*
         * Supabase sometimes returns an array
         * depending on RPC function return type.
         */
        let student = data;

        if (Array.isArray(data)) {

            if (data.length === 0) {
                throw new Error(
                    "Invalid mobile number or PIN."
                );
            }

            student = data[0];
        }

        console.log("Student:", student);

        /*
         * Check success response
         */
        if (
            student.success === false ||
            student.valid === false ||
            student.correct === false
        ) {

            showMessage(
                "loginMessage",
                student.message ||
                "Invalid mobile number or PIN.",
                "error"
            );

            button.disabled = false;
            button.textContent = "STUDENT LOGIN";

            return;
        }

        /*
         * Save student login
         */
        const studentLoginData = {

            id:
                student.id ||
                student.student_id ||
                "",

            owner_id:
                student.owner_id ||
                "",

            name:
                student.name ||
                student.full_name ||
                "",

            mobile:
                student.mobile ||
                student.mobile_number ||
                mobile,

            batch:
                student.batch ||
                "",

            instrument:
                student.instrument ||
                ""
        };

        console.log(
            "Saving student login:",
            studentLoginData
        );

        localStorage.setItem(
            "studentLogin",
            JSON.stringify(studentLoginData)
        );

        /*
         * Verify localStorage
         */
        const saved =
            localStorage.getItem("studentLogin");

        console.log(
            "Saved studentLogin:",
            saved
        );

        showMessage(
            "loginMessage",
            "Login successful. Opening dashboard...",
            "success"
        );

        /*
         * Open Student Dashboard
         */
        setTimeout(function () {

            window.location.href =
                "student-dashboard.html";

        }, 500);

    }

    catch (error) {

        console.error(
            "STUDENT LOGIN ERROR:",
            error
        );

        showMessage(
            "loginMessage",
            error.message ||
            "Student login failed.",
            "error"
        );

        button.disabled = false;
        button.textContent = "STUDENT LOGIN";
    }
}
</script>
