<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Fees</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    120deg,
                    #292879 0%,
                    #6c2d78 45%,
                    #bd2d68 100%
                );

            padding: 35px 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* HEADER */

        .header {
            background: white;
            border-radius: 20px;
            padding: 25px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .back-button {
            border: none;
            background: #f1f1f1;
            color: #9b245e;

            font-size: 14px;
            font-weight: 700;

            padding: 11px 18px;
            border-radius: 10px;

            cursor: pointer;
        }

        .back-button:hover {
            background: #e5e5e5;
        }

        /* STUDENT CARD */

        .student-card {
            background: white;
            border-radius: 20px;

            padding: 25px 30px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

            margin-bottom: 22px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .student-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
        }

        .student-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .student-value {
            font-size: 14px;
            color: #111827;
            font-weight: 700;
            word-break: break-word;
        }

        /* FEE CARD */

        .fee-card {
            background: white;
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

            margin-bottom: 22px;
        }

        .fee-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;
        }

        .fee-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }

        .status {
            padding: 8px 14px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .status.paid {
            background: #dcfce7;
            color: #166534;
        }

        .status.partial {
            background: #fef3c7;
            color: #92400e;
        }

        .status.pending {
            background: #fee2e2;
            color: #991b1b;
        }

        /* AMOUNTS */

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .amount-box {
            border: 1px solid #e5e7eb;
            border-radius: 13px;

            padding: 20px;
            background: #fff;
        }

        .amount-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .amount-value {
            color: #111827;
            font-size: 22px;
            font-weight: 700;
        }

        /* RECEIPT */

        .receipt-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            margin-top: 22px;

            background:
                linear-gradient(
                    90deg,
                    #292879,
                    #bd2d68
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .receipt-button:hover {
            opacity: 0.95;
        }

        /* HISTORY */

        .history-card {
            background: white;
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);
        }

        .history-card h2 {
            color: #111827;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .payment-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 0;

            border-bottom: 1px solid #eeeeee;
        }

        .payment-row:last-child {
            border-bottom: none;
        }

        .payment-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .payment-title {
            font-weight: 700;
            color: #111827;
            font-size: 14px;
        }

        .payment-date {
            color: #64748b;
            font-size: 13px;
        }

        .payment-mode {
            color: #8a2d72;
            font-size: 12px;
            font-weight: 700;
        }

        .payment-amount {
            color: #166534;
            font-size: 16px;
            font-weight: 700;
        }

        .no-history {
            padding: 25px;
            text-align: center;

            color: #64748b;

            background: #f8fafc;
            border-radius: 10px;
        }

        /* MESSAGE */

        .message {
            display: none;

            background: white;
            border-radius: 12px;

            padding: 15px;
            margin-bottom: 20px;

            font-size: 14px;
            color: #991b1b;
        }

        .message.show {
            display: block;
        }

        /* LOADING */

        .loading {
            background: white;
            border-radius: 20px;

            padding: 35px;

            text-align: center;
            color: #64748b;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

            margin-bottom: 22px;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            color:
                rgba(255,255,255,0.8);

            font-size: 12px;

            margin-top: 20px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            body {
                padding: 20px 12px;
            }

            .header {
                padding: 22px;
            }

            .header h1 {
                font-size: 24px;
            }

            .student-card,
            .fee-card,
            .history-card {
                padding: 22px;
            }

            .student-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .amount-grid {
                grid-template-columns: 1fr;
            }

            .fee-title-row {
                align-items: flex-start;
                gap: 12px;
            }

            .payment-row {
                gap: 15px;
            }

        }

        @media (max-width: 420px) {

            .student-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>
                My Fees
            </h1>

            <div
                class="subtitle"
                id="studentName">

                Student Fees

            </div>

        </div>


        <button
            class="back-button"
            onclick="goBack()">

            ← Back

        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- STUDENT INFORMATION -->

    <div class="student-card">

        <div class="student-grid">


            <div class="student-box">

                <div class="student-label">
                    STUDENT NAME
                </div>

                <div
                    class="student-value"
                    id="studentFullName">

                    -

                </div>

            </div>


            <div class="student-box">

                <div class="student-label">
                    MOBILE
                </div>

                <div
                    class="student-value"
                    id="studentMobile">

                    -

                </div>

            </div>


            <div class="student-box">

                <div class="student-label">
                    INSTRUMENT
                </div>

                <div
                    class="student-value"
                    id="studentInstrument">

                    -

                </div>

            </div>


            <div class="student-box">

                <div class="student-label">
                    BATCH
                </div>

                <div
                    class="student-value"
                    id="studentBatch">

                    -

                </div>

            </div>


        </div>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        Loading fees...

    </div>


    <!-- FEE CARD -->

    <div
        id="feeCard"
        class="fee-card"
        style="display:none;">


        <div class="fee-title-row">


            <div class="fee-title">

                My Fees

            </div>


            <div
                id="status"
                class="status pending">

                PENDING

            </div>


        </div>


        <div class="amount-grid">


            <!-- MONTHLY FEES -->

            <div class="amount-box">

                <div class="amount-label">

                    Monthly Fees

                </div>

                <div
                    class="amount-value"
                    id="monthlyAmount">

                    ₹ 0

                </div>

            </div>


            <!-- PAYMENT AMOUNT -->

            <div class="amount-box">

                <div class="amount-label">

                    Payment Amount

                </div>

                <div
                    class="amount-value"
                    id="paymentAmount">

                    ₹ 0

                </div>

            </div>


            <!-- BALANCE -->

            <div class="amount-box">

                <div class="amount-label">

                    Balance Due

                </div>

                <div
                    class="amount-value"
                    id="balanceAmount">

                    ₹ 0

                </div>

            </div>


        </div>


        <button
            class="receipt-button"
            onclick="openReceipt()">

            📄 View Fee Receipt

        </button>


    </div>


    <!-- PAYMENT HISTORY -->

    <div
        id="historyCard"
        class="history-card"
        style="display:none;">


        <h2>
            Payment History
        </h2>


        <div
            id="paymentHistory">

        </div>


    </div>


    <div class="footer">

        Music Academy Management

    </div>


</div>


<script>


/* =====================================================
   GLOBAL
===================================================== */

let studentData = null;

let paymentHistoryData = [];


/* =====================================================
   GET STUDENT LOGIN
===================================================== */

function getStudentLogin() {

    try {

        /*
         * Remember Me ON
         */

        const localData =
            localStorage.getItem(
                "studentLogin"
            );


        if (localData) {

            return JSON.parse(
                localData
            );

        }


        /*
         * Remember Me OFF
         */

        const sessionData =
            sessionStorage.getItem(
                "studentLogin"
            );


        if (sessionData) {

            return JSON.parse(
                sessionData
            );

        }


        return null;

    }
    catch (error) {

        console.error(
            "Student login error:",
            error
        );

        return null;

    }

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadStudent();

    }
);


/* =====================================================
   LOAD STUDENT
===================================================== */

async function loadStudent() {

    const savedStudent =
        getStudentLogin();


    if (!savedStudent) {

        window.location.href =
            "student-login.html";

        return;

    }


    try {

        studentData =
            savedStudent;


        const mobile =
            String(
                studentData.mobile ||
                studentData.mobile_number ||
                studentData.mobileNumber ||
                ""
            ).trim();


        if (!mobile) {

            throw new Error(
                "Student mobile number not found."
            );

        }


        /*
         * First show saved student information.
         */

        showStudentInformation(
            studentData,
            mobile
        );


        /*
         * Then get fresh student data
         * from Supabase.
         */

        await loadFees(
            mobile
        );

    }
    catch (error) {

        console.error(
            "Student load error:",
            error
        );


        hideLoading();


        showMessage(
            error.message ||
            "Unable to load student."
        );

    }

}


/* =====================================================
   SHOW STUDENT
===================================================== */

function showStudentInformation(
    student,
    mobile
) {

    document.getElementById(
        "studentName"
    ).innerText =
        student.full_name ||
        student.name ||
        "Student";


    document.getElementById(
        "studentFullName"
    ).innerText =
        student.full_name ||
        student.name ||
        "-";


    document.getElementById(
        "studentMobile"
    ).innerText =
        mobile;


    document.getElementById(
        "studentInstrument"
    ).innerText =
        student.instrument ||
        "-";


    document.getElementById(
        "studentBatch"
    ).innerText =
        student.batch ||
        "-";

}


/* =====================================================
   LOAD FEES
===================================================== */

async function loadFees(
    mobile
) {

    showLoading();

    hideMessage();


    try {

        console.log(
            "Loading fees for:",
            mobile
        );


        /* =========================================
           GET STUDENT + FEE
        ========================================= */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "student_get_fees_by_mobile",
                {
                    p_mobile:
                        mobile
                }
            );


        console.log(
            "Fees response:",
            data
        );


        if (error) {

            throw new Error(
                error.message
            );

        }


        if (
            !data ||
            data.success !== true
        ) {

            throw new Error(
                data?.message ||
                "Unable to load student fees."
            );

        }


        /* =========================================
           STUDENT FROM SUPABASE
        ========================================= */

        const student =
            data.student || {};


        /*
         * Merge fresh data.
         */

        studentData = {

            ...studentData,

            ...student,

            id:
                student.id ||
                studentData.id ||
                studentData.student_id ||
                "",

            student_id:
                student.id ||
                studentData.student_id ||
                studentData.id ||
                "",

            mobile:
                student.mobile_number ||
                mobile,

            mobile_number:
                student.mobile_number ||
                mobile,

            full_name:
                student.full_name ||
                studentData.full_name ||
                studentData.name ||
                "",

            instrument:
                student.instrument ||
                studentData.instrument ||
                "",

            batch:
                student.batch ||
                studentData.batch ||
                ""

        };


        /*
         * IMPORTANT:
         *
         * Save updated data to whichever
         * storage contains the login.
         */

        saveStudentLogin(
            studentData
        );


        showStudentInformation(
            studentData,
            mobile
        );


        /* =========================================
           FEE
        ========================================= */

        const fee =
            data.fee || {};


        /*
         * Monthly fee.
         *
         * Student fees_amount is primary.
         */

        const monthly =
            Number(
                student.fees_amount ??
                fee.amount ??
                fee.monthly_amount ??
                student.monthly_fee ??
                student.fee_amount ??
                0
            );


        /* =========================================
           PAYMENT HISTORY
        ========================================= */

        await loadPaymentHistory(
            mobile
        );


        /*
         * Total payments
         */

        let totalReceived = 0;


        /*
         * Latest payment amount
         */

        let latestPaymentAmount = 0;


        if (
            paymentHistoryData.length > 0
        ) {

            paymentHistoryData.forEach(
                function(payment) {

                    totalReceived +=
                        Number(
                            payment.amount || 0
                        );

                }
            );


            /*
             * RPC returns newest payment first.
             *
             * Therefore:
             *
             * paymentHistoryData[0]
             *
             * = latest payment.
             */

            latestPaymentAmount =
                Number(
                    paymentHistoryData[0].amount || 0
                );

        }


        /* =========================================
           BALANCE
        ========================================= */

        const balance =
            Math.max(
                monthly -
                totalReceived,
                0
            );


        /* =========================================
           MONTHLY
        ========================================= */

        document.getElementById(
            "monthlyAmount"
        ).innerText =
            formatMoney(
                monthly
            );


        /* =========================================
           PAYMENT AMOUNT
        ========================================= */

        document.getElementById(
            "paymentAmount"
        ).innerText =
            formatMoney(
                latestPaymentAmount
            );


        /* =========================================
           BALANCE
        ========================================= */

        document.getElementById(
            "balanceAmount"
        ).innerText =
            formatMoney(
                balance
            );


        /* =========================================
           STATUS
        ========================================= */

        let statusValue =
            "unpaid";


        if (
            monthly > 0 &&
            totalReceived >= monthly
        ) {

            statusValue =
                "paid";

        }
        else if (
            totalReceived > 0 &&
            totalReceived < monthly
        ) {

            statusValue =
                "partial";

        }


        const statusElement =
            document.getElementById(
                "status"
            );


        statusElement.className =
            "status";


        if (
            statusValue === "paid"
        ) {

            statusElement.classList.add(
                "paid"
            );

            statusElement.innerText =
                "PAID";

        }
        else if (
            statusValue === "partial"
        ) {

            statusElement.classList.add(
                "partial"
            );

            statusElement.innerText =
                "PARTIAL";

        }
        else {

            statusElement.classList.add(
                "pending"
            );

            statusElement.innerText =
                "PENDING";

        }


        /* =========================================
           SHOW CARD
        ========================================= */

        hideLoading();


        document.getElementById(
            "feeCard"
        ).style.display =
            "block";

    }
    catch (error) {

        console.error(
            "Load fees error:",
            error
        );


        hideLoading();


        showMessage(
            "Unable to load student fees: " +
            error.message
        );

    }

}


/* =====================================================
   SAVE STUDENT LOGIN
===================================================== */

function saveStudentLogin(
    data
) {

    try {

        /*
         * If localStorage has studentLogin,
         * keep using localStorage.
         */

        if (
            localStorage.getItem(
                "studentLogin"
            )
        ) {

            localStorage.setItem(
                "studentLogin",
                JSON.stringify(
                    data
                )
            );

        }


        /*
         * If sessionStorage has studentLogin,
         * update sessionStorage.
         */

        if (
            sessionStorage.getItem(
                "studentLogin"
            )
        ) {

            sessionStorage.setItem(
                "studentLogin",
                JSON.stringify(
                    data
                )
            );

        }


        /*
         * Safety fallback.
         */

        if (
            !localStorage.getItem(
                "studentLogin"
            ) &&
            !sessionStorage.getItem(
                "studentLogin"
            )
        ) {

            localStorage.setItem(
                "studentLogin",
                JSON.stringify(
                    data
                )
            );

        }

    }
    catch (error) {

        console.error(
            "Could not save student login:",
            error
        );

    }

}


/* =====================================================
   PAYMENT HISTORY
===================================================== */

async function loadPaymentHistory(
    mobile
) {

    const historyCard =
        document.getElementById(
            "historyCard"
        );


    const historyContainer =
        document.getElementById(
            "paymentHistory"
        );


    historyCard.style.display =
        "block";


    historyContainer.innerHTML =
        '<div class="no-history">Loading payment history...</div>';


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "student_get_payment_history_by_mobile",
                {
                    p_mobile:
                        mobile
                }
            );


        if (error) {

            throw new Error(
                error.message
            );

        }


        if (
            !data ||
            data.success !== true
        ) {

            throw new Error(
                data?.message ||
                "Unable to load payment history."
            );

        }


        paymentHistoryData =
            Array.isArray(
                data.payments
            )
                ? data.payments
                : [];


        /*
         * Make sure newest payment is first.
         */

        paymentHistoryData.sort(
            function(a, b) {

                const dateA =
                    new Date(
                        a.payment_date || 0
                    ).getTime();


                const dateB =
                    new Date(
                        b.payment_date || 0
                    ).getTime();


                return dateB - dateA;

            }
        );


        /* =========================================
           NO HISTORY
        ========================================= */

        if (
            paymentHistoryData.length === 0
        ) {

            historyContainer.innerHTML =
                '<div class="no-history">No payment history available.</div>';

            return;

        }


        /* =========================================
           SHOW HISTORY
        ========================================= */

        historyContainer.innerHTML =
            "";


        paymentHistoryData.forEach(
            function(payment) {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "payment-row";


                const left =
                    document.createElement(
                        "div"
                    );


                left.className =
                    "payment-left";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "payment-title";


                title.innerText =
                    "Payment Received";


                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "payment-date";


                date.innerText =
                    formatDate(
                        payment.payment_date
                    );


                const mode =
                    document.createElement(
                        "div"
                    );


                mode.className =
                    "payment-mode";


                mode.innerText =
                    "Mode: " +
                    (
                        payment.payment_mode ||
                        "-"
                    );


                left.appendChild(
                    title
                );


                left.appendChild(
                    date
                );


                left.appendChild(
                    mode
                );


                const amount =
                    document.createElement(
                        "div"
                    );


                amount.className =
                    "payment-amount";


                amount.innerText =
                    "+ " +
                    formatMoney(
                        payment.amount
                    );


                row.appendChild(
                    left
                );


                row.appendChild(
                    amount
                );


                historyContainer.appendChild(
                    row
                );

            }
        );

    }
    catch (error) {

        console.error(
            "Payment history error:",
            error
        );


        paymentHistoryData =
            [];


        historyContainer.innerHTML =
            '<div class="no-history">Unable to load payment history.</div>';

    }

}


/* =====================================================
   OPEN RECEIPT
===================================================== */

function openReceipt() {

    /*
     * Get latest student data.
     */

    const login =
        getStudentLogin();


    /*
     * Prefer current studentData.
     */

    const student =
        studentData ||
        login;


    if (!student) {

        showMessage(
            "Student information is not available."
        );

        return;

    }


    /*
     * Get ID.
     */

    const id =
        student.id ||
        student.student_id ||
        login?.id ||
        login?.student_id ||
        "";


    /*
     * Get mobile.
     */

    const mobile =
        String(
            student.mobile_number ||
            student.mobile ||
            login?.mobile_number ||
            login?.mobile ||
            ""
        ).trim();


    /*
     * We need at least ID OR mobile.
     */

    if (
        !id &&
        !mobile
    ) {

        showMessage(
            "Student ID and mobile number are not available."
        );

        return;

    }


    /*
     * =========================================
     * BUILD RECEIPT URL
     * =========================================
     *
     * Send BOTH ID and mobile.
     *
     * Receipt page can use whichever
     * one is available.
     */

    let url =
        "fee-receipt.html";


    const query =
        [];


    if (id) {

        query.push(
            "student=" +
            encodeURIComponent(
                id
            )
        );

    }


    if (mobile) {

        query.push(
            "mobile=" +
            encodeURIComponent(
                mobile
            )
        );

    }


    if (
        query.length > 0
    ) {

        url +=
            "?" +
            query.join("&");

    }


    console.log(
        "Opening student receipt:",
        url
    );


    window.location.href =
        url;

}


/* =====================================================
   BACK
===================================================== */

function goBack() {

    window.location.href =
        "student-dashboard.html";

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(
    amount
) {

    return "₹ " +
        Number(
            amount || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "-";

    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading() {

    document.getElementById(
        "loading"
    ).style.display =
        "block";

}


function hideLoading() {

    document.getElementById(
        "loading"
    ).style.display =
        "none";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.classList.add(
        "show"
    );

}


function hideMessage() {

    document.getElementById(
        "message"
    ).classList.remove(
        "show"
    );

}
