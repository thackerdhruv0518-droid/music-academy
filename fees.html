<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fees - Music Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#29245f,#bd2863);
    min-height:100vh;
}

.container{
    width:96%;
    max-width:1250px;
    margin:25px auto;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.header{
    background:linear-gradient(135deg,#20205b,#47205b);
    color:white;
    padding:28px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:29px;
}

.header p{
    margin:6px 0 0;
    opacity:.85;
}

.back-btn{
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12);
    color:white;
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
}

.staff-badge{
    display:none;
    margin-top:8px;
    padding:5px 10px;
    border-radius:20px;
    border:1px solid #ffffff55;
    background:#ffffff18;
    font-size:12px;
}

.content{
    padding:30px;
}

.filters{
    display:grid;
    grid-template-columns:150px 120px 220px 1fr;
    gap:12px;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#6158e8;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.summary-card{
    padding:20px;
    border:1px solid #eee;
    border-radius:15px;
    background:#fafafa;
}

.summary-title{
    color:#777;
    font-size:13px;
}

.summary-value{
    font-size:24px;
    font-weight:bold;
    margin-top:7px;
}

.student-row{
    border:1px solid #e6e6e6;
    border-radius:15px;
    padding:17px;
    margin-bottom:12px;
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:20px;
}

.student-name{
    font-size:18px;
    font-weight:bold;
}

.student-sub{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.amount{
    text-align:right;
}

.amount small{
    display:block;
    color:#777;
}

.amount strong{
    font-size:17px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    margin-top:6px;
}

.pending{
    background:#fff0d5;
    color:#a66a00;
}

.partial{
    background:#e8edff;
    color:#4258c8;
}

.paid{
    background:#ddf8e7;
    color:#168043;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.btn{
    border:0;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.pay{
    background:#6158e8;
    color:white;
}

.history{
    background:#eeeaff;
    color:#5148d8;
}

.receipt{
    background:#e8f8ef;
    color:#168043;
}

.empty{
    text-align:center;
    padding:50px;
    color:#777;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:white;
    border-radius:18px;
    padding:25px;
}

.modal-box h2{
    margin-top:0;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
}

.cancel{
    background:#eee;
}

.save{
    background:#6158e8;
    color:white;
}

.history-item{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:850px){

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .student-row{
        grid-template-columns:1fr;
    }

    .amount{
        text-align:left;
    }

    .actions{
        justify-content:flex-start;
    }
}

@media(max-width:600px){

    .container{
        width:100%;
        margin:0;
        border-radius:0;
        min-height:100vh;
    }

    .header{
        padding:22px;
    }

    .content{
        padding:18px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>💰 Fees Management</h1>
            <p>Student-wise monthly fees</p>

            <div id="staffBadge" class="staff-badge">
                Staff Access
            </div>
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Back
        </button>

    </div>


    <div class="content">

        <div class="filters">

            <select id="month">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>

            <select id="year"></select>

            <select id="batch">
                <option value="">All Batches</option>
            </select>

            <input
                id="search"
                placeholder="🔎 Search student"
            >

        </div>


        <div class="summary">

            <div class="summary-card">
                <div class="summary-title">
                    Total Students
                </div>

                <div class="summary-value" id="totalStudents">
                    0
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-title">
                    Total Fees
                </div>

                <div class="summary-value" id="totalFees">
                    ₹0
                </div>
            </div>


            <div class="summary-card">
                <div class="summary-title">
                    Received
                </div>

                <div class="summary-value" id="receivedFees">
                    ₹0
                </div>
            </div>

        </div>


        <div id="loading" class="loading">
            Loading fees...
        </div>

        <div id="feeList"></div>

    </div>

</div>


<!-- PAYMENT MODAL -->

<div id="paymentModal" class="modal">

    <div class="modal-box">

        <h2>Make Payment</h2>

        <p id="paymentStudent"></p>

        <label>Payment Amount</label>

        <input
            id="paymentAmount"
            type="number"
            min="1"
            placeholder="Enter amount"
        >

        <br><br>

        <label>Payment Date</label>

        <input
            id="paymentDate"
            type="date"
        >

        <div class="modal-buttons">

            <button
                class="btn cancel"
                onclick="closePayment()"
            >
                Cancel
            </button>

            <button
                class="btn save"
                onclick="savePayment()"
            >
                Save Payment
            </button>

        </div>

    </div>

</div>


<!-- HISTORY MODAL -->

<div id="historyModal" class="modal">

    <div class="modal-box">

        <h2>Payment History</h2>

        <p id="historyStudent"></p>

        <div id="historyList">
            Loading...
        </div>

        <div class="modal-buttons">

            <button
                class="btn cancel"
                onclick="closeHistory()"
            >
                Close
            </button>

        </div>

    </div>

</div>


<script>

let isStaff = false;
let staffInfo = null;

let feesData = [];
let selectedStudent = null;


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    start
);


async function start(){

    setupDate();

    checkStaff();

    await loadFees();

}


/* =========================
   DATE
========================= */

function setupDate(){

    const now = new Date();

    document.getElementById("month").value =
        now.getMonth() + 1;


    const yearSelect =
        document.getElementById("year");

    const currentYear =
        now.getFullYear();

    for(let y=currentYear-2; y<=currentYear+2; y++){

        const option =
            document.createElement("option");

        option.value = y;
        option.textContent = y;

        if(y === currentYear){
            option.selected = true;
        }

        yearSelect.appendChild(option);

    }

}


/* =========================
   STAFF CHECK
========================= */

function checkStaff(){

    try{

        const saved =
            localStorage.getItem("staffLogin");

        if(saved){

            staffInfo =
                JSON.parse(saved);

            if(
                staffInfo &&
                staffInfo.id &&
                staffInfo.name
            ){

                isStaff = true;

                document.getElementById(
                    "staffBadge"
                ).style.display = "inline-block";

            }

        }

    }catch(e){

        console.log(e);

    }

}


/* =========================
   LOAD FEES
========================= */

async function loadFees(){

    document.getElementById(
        "loading"
    ).style.display = "block";


    try{

        const month =
            Number(
                document.getElementById("month").value
            );

        const year =
            Number(
                document.getElementById("year").value
            );


        /* STAFF */

        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_get_fees",
                    {
                        p_staff_id: staffInfo.id,
                        p_month: month,
                        p_year: year
                    }
                );


            if(result.error){

                console.error(result.error);

                document.getElementById(
                    "loading"
                ).innerHTML =
                    "❌ Error loading fees";

                return;

            }


            if(!result.data?.success){

                document.getElementById(
                    "loading"
                ).innerHTML =
                    "❌ Staff access not approved";

                return;

            }


            feesData =
                result.data.fees || [];

        }


        /* OWNER */

        else{

            const userResult =
                await supabaseClient.auth.getUser();

            const user =
                userResult.data.user;

            if(!user){

                window.location.href =
                    "login.html";

                return;

            }


            const studentsResult =
                await supabaseClient
                    .from("students")
                    .select("*")
                    .eq("owner_id", user.id)
                    .order("full_name");


            if(studentsResult.error){

                console.error(
                    studentsResult.error
                );

                return;

            }


            const students =
                studentsResult.data || [];


            feesData = [];


            for(const student of students){

                const feeResult =
                    await supabaseClient
                        .from("fees")
                        .select("*")
                        .eq(
                            "student_id",
                            student.id
                        )
                        .eq(
                            "fees_month",
                            month
                        )
                        .eq(
                            "fees_year",
                            year
                        )
                        .maybeSingle();


                const fee =
                    feeResult.data;


                feesData.push({

                    student_id: student.id,

                    full_name:
                        student.full_name,

                    mobile_number:
                        student.mobile_number,

                    instrument:
                        student.instrument,

                    batch:
                        student.batch,

                    monthly_amount:
                        fee?.monthly_amount ??
                        student.fees_amount,

                    fee_id:
                        fee?.id ?? null,

                    fees_month: month,

                    fees_year: year,

                    paid_amount:
                        fee?.paid_amount ?? 0,

                    status:
                        fee?.status ?? "pending"

                });

            }

        }


        document.getElementById(
            "loading"
        ).style.display = "none";


        createBatchFilter();

        renderFees();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML =
            "❌ Something went wrong";

    }

}


/* =========================
   BATCH
========================= */

function createBatchFilter(){

    const select =
        document.getElementById("batch");

    const old =
        select.value;

    select.innerHTML =
        `<option value="">All Batches</option>`;


    const batches =
        [...new Set(
            feesData
                .map(x => x.batch)
                .filter(Boolean)
        )].sort();


    batches.forEach(batch => {

        const option =
            document.createElement("option");

        option.value = batch;
        option.textContent = batch;

        select.appendChild(option);

    });


    if(batches.includes(old)){
        select.value = old;
    }

}


/* =========================
   RENDER
========================= */

function renderFees(){

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const batch =
        document.getElementById("batch").value;


    const filtered =
        feesData.filter(item => {

            const name =
                (item.full_name || "")
                    .toLowerCase();

            const mobile =
                (item.mobile_number || "")
                    .toLowerCase();

            return (
                (!search ||
                 name.includes(search) ||
                 mobile.includes(search))
                &&
                (!batch ||
                 item.batch === batch)
            );

        });


    let totalFees = 0;
    let received = 0;


    filtered.forEach(item => {

        totalFees +=
            Number(item.monthly_amount || 0);

        received +=
            Number(item.paid_amount || 0);

    });


    document.getElementById(
        "totalStudents"
    ).textContent =
        filtered.length;


    document.getElementById(
        "totalFees"
    ).textContent =
        money(totalFees);


    document.getElementById(
        "receivedFees"
    ).textContent =
        money(received);


    const list =
        document.getElementById("feeList");


    if(filtered.length === 0){

        list.innerHTML = `
            <div class="empty">
                <div style="font-size:45px;">💰</div>
                <h3>No students found</h3>
            </div>
        `;

        return;

    }


    list.innerHTML =
        filtered.map(item => {

            const monthly =
                Number(
                    item.monthly_amount || 0
                );

            const paid =
                Number(
                    item.paid_amount || 0
                );

            const balance =
                Math.max(
                    0,
                    monthly - paid
                );


            const status =
                item.status || "pending";


            return `

                <div class="student-row">

                    <div>

                        <div class="student-name">
                            ${escapeHtml(item.full_name)}
                        </div>

                        <div class="student-sub">
                            📱 ${escapeHtml(item.mobile_number || "-")}
                            &nbsp; • &nbsp;
                            🎵 ${escapeHtml(item.instrument || "-")}
                            &nbsp; • &nbsp;
                            🕐 ${escapeHtml(item.batch || "-")}
                        </div>

                        <span class="status ${status}">
                            ${status.toUpperCase()}
                        </span>

                    </div>


                    <div class="amount">

                        <small>Monthly</small>

                        <strong>
                            ${money(monthly)}
                        </strong>

                        <small>
                            Paid: ${money(paid)}
                        </small>

                        <small>
                            Balance: ${money(balance)}
                        </small>

                    </div>


                    <div class="actions">

                        ${
                            balance > 0
                            ?
                            `
                            <button
                                class="btn pay"
                                onclick="openPayment('${item.student_id}')"
                            >
                                + Payment
                            </button>
                            `
                            :
                            ""
                        }


                        <button
                            class="btn history"
                            onclick="openHistory('${item.student_id}')"
                        >
                            History
                        </button>


                        <button
                            class="btn receipt"
                            onclick="openReceipt('${item.student_id}')"
                        >
                            Receipt
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   PAYMENT
========================= */

function openPayment(studentId){

    selectedStudent =
        feesData.find(
            x => x.student_id === studentId
        );

    if(!selectedStudent) return;


    document.getElementById(
        "paymentStudent"
    ).textContent =
        selectedStudent.full_name;


    document.getElementById(
        "paymentAmount"
    ).value = "";


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    document.getElementById(
        "paymentDate"
    ).value = today;


    document.getElementById(
        "paymentModal"
    ).style.display = "flex";

}


function closePayment(){

    document.getElementById(
        "paymentModal"
    ).style.display = "none";

    selectedStudent = null;

}


/* =========================
   SAVE PAYMENT
========================= */

async function savePayment(){

    if(!selectedStudent) return;


    const amount =
        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        );


    const date =
        document.getElementById(
            "paymentDate"
        ).value;


    if(!amount || amount <= 0){

        alert("Enter valid payment amount.");

        return;

    }


    const monthly =
        Number(
            selectedStudent.monthly_amount || 0
        );

    const paid =
        Number(
            selectedStudent.paid_amount || 0
        );

    const balance =
        monthly - paid;


    if(amount > balance){

        alert(
            "Payment cannot be greater than balance."
        );

        return;

    }


    if(!date){

        alert("Select payment date.");

        return;

    }


    try{

        let result;


        if(isStaff){

            result =
                await supabaseClient.rpc(
                    "staff_make_fee_payment",
                    {
                        p_staff_id:
                            staffInfo.id,

                        p_student_id:
                            selectedStudent.student_id,

                        p_month:
                            Number(
                                document.getElementById(
                                    "month"
                                ).value
                            ),

                        p_year:
                            Number(
                                document.getElementById(
                                    "year"
                                ).value
                            ),

                        p_amount:
                            amount,

                        p_payment_date:
                            date + "T12:00:00"
                    }
                );

        }
        else{

            const userResult =
                await supabaseClient.auth.getUser();

            const user =
                userResult.data.user;


            let feeId =
                selectedStudent.fee_id;


            if(!feeId){

                const insertFee =
                    await supabaseClient
                        .from("fees")
                        .insert({

                            owner_id: user.id,

                            student_id:
                                selectedStudent.student_id,

                            fees_month:
                                Number(
                                    document.getElementById(
                                        "month"
                                    ).value
                                ),

                            fees_year:
                                Number(
                                    document.getElementById(
                                        "year"
                                    ).value
                                ),

                            monthly_amount:
                                monthly,

                            paid_amount:0,

                            status:"pending"

                        })
                        .select()
                        .single();


                if(insertFee.error){

                    alert(
                        "❌ Could not create fee record."
                    );

                    return;

                }


                feeId =
                    insertFee.data.id;

            }


            const newPaid =
                paid + amount;


            const newStatus =
                newPaid >= monthly
                ? "paid"
                : "partial";


            const payment =
                await supabaseClient
                    .from("fee_payments")
                    .insert({

                        owner_id:user.id,

                        fee_id:feeId,

                        student_id:
                            selectedStudent.student_id,

                        amount:amount,

                        payment_date:
                            date + "T12:00:00"

                    });


            if(payment.error){

                alert("❌ Payment failed.");

                return;

            }


            const update =
                await supabaseClient
                    .from("fees")
                    .update({

                        paid_amount:newPaid,

                        status:newStatus

                    })
                    .eq("id",feeId);


            if(update.error){

                alert(
                    "❌ Fee update failed."
                );

                return;

            }

        }


        if(result?.error){

            console.error(result.error);

            alert("❌ Payment failed.");

            return;

        }


        if(
            isStaff &&
            result?.data &&
            !result.data.success
        ){

            alert(
                "❌ " +
                (
                    result.data.message ||
                    "Payment failed"
                )
            );

            return;

        }


        alert("✅ Payment saved successfully.");

        closePayment();

        await loadFees();

    }
    catch(error){

        console.error(error);

        alert("❌ Something went wrong.");

    }

}


/* =========================
   HISTORY
========================= */

async function openHistory(studentId){

    selectedStudent =
        feesData.find(
            x => x.student_id === studentId
        );


    if(!selectedStudent) return;


    document.getElementById(
        "historyStudent"
    ).textContent =
        selectedStudent.full_name;


    document.getElementById(
        "historyList"
    ).innerHTML =
        "Loading...";


    document.getElementById(
        "historyModal"
    ).style.display = "flex";


    try{

        const month =
            Number(
                document.getElementById("month").value
            );

        const year =
            Number(
                document.getElementById("year").value
            );


        if(isStaff){

            const result =
                await supabaseClient.rpc(
                    "staff_get_payment_history",
                    {
                        p_staff_id:
                            staffInfo.id,

                        p_student_id:
                            studentId,

                        p_month:month,

                        p_year:year
                    }
                );


            if(result.error){

                throw result.error;

            }


            if(!result.data.success){

                throw new Error(
                    result.data.message
                );

            }


            renderHistory(
                result.data.payments || []
            );

        }
        else{

            const result =
                await supabaseClient
                    .from("fee_payments")
                    .select("*")
                    .eq(
                        "student_id",
                        studentId
                    )
                    .order(
                        "payment_date",
                        {
                            ascending:false
                        }
                    );


            if(result.error){

                throw result.error;

            }


            renderHistory(
                result.data || []
            );

        }

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "historyList"
        ).innerHTML =
            "❌ Could not load history.";

    }

}


function renderHistory(payments){

    const box =
        document.getElementById(
            "historyList"
        );


    if(!payments.length){

        box.innerHTML =
            `<div class="empty">No payments yet.</div>`;

        return;

    }


    box.innerHTML =
        payments.map(payment => {

            const date =
                new Date(
                    payment.payment_date
                ).toLocaleDateString(
                    "en-IN"
                );


            return `

                <div class="history-item">

                    <span>
                        📅 ${date}
                    </span>

                    <strong>
                        ${money(payment.amount)}
                    </strong>

                </div>

            `;

        }).join("");

}


function closeHistory(){

    document.getElementById(
        "historyModal"
    ).style.display = "none";

}


/* =========================
   RECEIPT
========================= */

function openReceipt(studentId){

    const month =
        Number(
            document.getElementById("month").value
        );

    const year =
        Number(
            document.getElementById("year").value
        );


    if(isStaff){

        window.location.href =
            `fee-receipt.html?student=${encodeURIComponent(studentId)}&month=${month}&year=${year}&staff=1`;

    }
    else{

        window.location.href =
            `fee-receipt.html?student=${encodeURIComponent(studentId)}&month=${month}&year=${year}`;

    }

}

/* =========================
   HELPERS
========================= */

function money(value){

    return "₹" +
        Number(value || 0)
            .toLocaleString("en-IN",{
                minimumFractionDigits:0,
                maximumFractionDigits:2
            });

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
