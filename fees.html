<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fees - Music Academy</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #29245f, #bd2863);
            color: white;
            padding: 18px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            opacity: .9;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            top: 15px;
            background: white;
            color: #29245f;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            text-align: center;
        }

        .summary-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 24px;
            color: #29245f;
        }

        .filters {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #bd2863;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #29245f;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .partial {
            color: #e67e00;
            font-weight: bold;
        }

        .unpaid {
            color: #d32f2f;
            font-weight: bold;
        }

        .btn {
            border: none;
            padding: 8px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin: 2px;
        }

        .pay-btn {
            background: #198754;
            color: white;
        }

        .history-btn {
            background: #29245f;
            color: white;
        }

        .receipt-btn {
            background: #bd2863;
            color: white;
        }

        .btn:hover {
            opacity: .85;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 14px;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h2 {
            color: #29245f;
            margin-bottom: 8px;
        }

        .student-name {
            color: #666;
            margin-bottom: 18px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel {
            background: #ddd;
        }

        .save {
            background: #198754;
            color: white;
        }

        .history-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .history-item strong {
            color: #29245f;
        }

        .empty,
        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media(max-width: 700px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 20px;
            }

            .back-btn {
                position: static;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <button class="back-btn" onclick="goBack()">
        ← Back
    </button>

    <h1 id="className">
        Music Academy
    </h1>

    <p>
        Fees Management
    </p>

</header>


<div class="container">

    <!-- FILTERS -->

    <div class="filters">

        <div>

            <label>
                Batch
            </label>

            <select
                id="batchFilter"
                onchange="renderTable()">

                <option value="">
                    All Batches
                </option>

            </select>

        </div>


        <div>

            <label>
                Search Student
            </label>

            <input
                id="searchInput"
                type="text"
                placeholder="Student name..."
                oninput="renderTable()">

        </div>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                Total Students
            </h3>

            <strong id="totalStudents">
                0
            </strong>

        </div>


        <div class="summary-card">

            <h3>
                Total Fees
            </h3>

            <strong id="totalFees">
                ₹0
            </strong>

        </div>


        <div class="summary-card">

            <h3>
                Received Fees
            </h3>

            <strong id="totalReceived">
                ₹0
            </strong>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>
                        Student
                    </th>

                    <th>
                        Batch
                    </th>

                    <th>
                        Instrument
                    </th>

                    <th>
                        Monthly Fees
                    </th>

                    <th>
                        Received
                    </th>

                    <th>
                        Balance
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="feesTableBody">

                <tr>

                    <td
                        colspan="8"
                        class="loading">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- ================= PAYMENT MODAL ================= -->

<div
    id="paymentModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Make Payment
        </h2>

        <p
            id="paymentStudent"
            class="student-name">
        </p>


        <label>
            Payment Amount
        </label>

        <input
            id="paymentAmount"
            type="number"
            min="1"
            placeholder="Enter amount">


        <br><br>


        <label>
            Payment Date
        </label>

        <input
            id="paymentDate"
            type="date">


        <br><br>


        <label>
            Payment Mode
        </label>

        <select id="paymentMode">

            <option value="">
                Select Payment Mode
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Bank Transfer">
                Bank Transfer
            </option>

            <option value="Card">
                Card
            </option>

            <option value="Cheque">
                Cheque
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closePayment()">

                Cancel

            </button>


            <button
                class="save"
                onclick="savePayment()">

                Save Payment

            </button>

        </div>

    </div>

</div>


<!-- ================= HISTORY MODAL ================= -->

<div
    id="historyModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Payment History
        </h2>

        <p
            id="historyStudent"
            class="student-name">
        </p>


        <div id="historyContent">
            Loading...
        </div>


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeHistory()">

                Close

            </button>

        </div>

    </div>

</div>


<script>

let allStudents = [];

let selectedStudent = null;

let user = null;

let staffInfo = null;

let currentMode = "owner";


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await detectLogin();

    }
);


// =====================================================
// LOGIN
// =====================================================

async function detectLogin() {

    try {

        const ownerLogin =
            localStorage.getItem("ownerLogin");

        const staffLogin =
            localStorage.getItem("staffLogin");


        if (ownerLogin) {

            currentMode = "owner";

            user =
                JSON.parse(ownerLogin);


            await loadOwnerBranding();

            await loadBatches();

            await loadStudents();

            return;

        }


        if (staffLogin) {

            currentMode = "staff";

            staffInfo =
                JSON.parse(staffLogin);


            await loadStaffBranding();

            await loadStaffBatches();

            await loadStudents();

            return;

        }


        alert(
            "Please login first."
        );

        window.location.href =
            "index.html";

    }
    catch (error) {

        console.error(error);

        alert(
            "Login information error."
        );

        window.location.href =
            "index.html";

    }

}


// =====================================================
// OWNER BRANDING
// =====================================================

async function loadOwnerBranding() {

    if (!user || !user.email)
        return;


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "get_owner_branding",
            {
                p_email: user.email
            }
        );


    if (!error && data) {

        document.getElementById(
            "className"
        ).textContent =
            data.class_name ||
            "Music Academy";

    }

}


// =====================================================
// STAFF BRANDING
// =====================================================

async function loadStaffBranding() {

    if (!staffInfo)
        return;


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "get_staff_branding",
            {
                p_email:
                    staffInfo.email,

                p_mobile:
                    staffInfo.mobile
            }
        );


    if (!error && data) {

        document.getElementById(
            "className"
        ).textContent =
            data.class_name ||
            "Music Academy";

    }

}


// =====================================================
// OWNER BATCHES
// =====================================================

async function loadBatches() {

    const select =
        document.getElementById(
            "batchFilter"
        );


    select.innerHTML =
        `<option value="">
            All Batches
        </option>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("batches")
            .select("*")
            .eq(
                "owner_id",
                user.id
            )
            .order("name");


    if (error) {

        console.error(error);

        return;

    }


    (data || []).forEach(
        batch => {

            const name =
                batch.name ||
                batch.batch_name;


            if (!name)
                return;


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                name;

            option.textContent =
                name;


            select.appendChild(
                option
            );

        }
    );

}


// =====================================================
// STAFF BATCHES
// =====================================================

async function loadStaffBatches() {

    const select =
        document.getElementById(
            "batchFilter"
        );


    select.innerHTML =
        `<option value="">
            All Batches
        </option>`;


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "staff_get_batches",
            {
                p_staff_id:
                    staffInfo.id
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    (data || []).forEach(
        batch => {

            const name =
                batch.name ||
                batch.batch_name ||
                batch.batch;


            if (!name)
                return;


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                name;

            option.textContent =
                name;


            select.appendChild(
                option
            );

        }
    );

}


// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents() {

    try {

        if (currentMode === "staff") {

            /*
             * Staff student RPC
             */

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "staff_get_students",
                    {
                        p_staff_id:
                            staffInfo.id
                    }
                );


            if (error) {

                console.error(
                    "Staff student error:",
                    error
                );

                /*
                 * If staff RPC does not exist,
                 * stop here.
                 */

                throw error;

            }


            allStudents =
                (data || []).map(
                    student => {

                        return {

                            id:
                                student.id ||
                                student.student_id,

                            full_name:
                                student.full_name ||
                                student.name ||
                                student.student_name,

                            mobile_number:
                                student.mobile_number ||
                                student.mobile ||
                                "",

                            instrument:
                                student.instrument ||
                                "",

                            batch:
                                student.batch ||
                                "",

                            monthly_fee:
                                Number(
                                    student.monthly_fee ||
                                    student.fee_amount ||
                                    student.amount ||
                                    0
                                ),

                            paid_amount: 0

                        };

                    }
                );


        }
        else {

            /*
             * OWNER STUDENTS
             */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("students")
                    .select("*")
                    .eq(
                        "owner_id",
                        user.id
                    )
                    .order(
                        "full_name"
                    );


            if (error)
                throw error;


            allStudents =
                (data || []).map(
                    student => {

                        return {

                            id:
                                student.id,

                            full_name:
                                student.full_name ||
                                student.name ||
                                "",

                            mobile_number:
                                student.mobile_number ||
                                student.mobile ||
                                "",

                            instrument:
                                student.instrument ||
                                "",

                            batch:
                                student.batch ||
                                "",

                            monthly_fee:
                                Number(
                                    student.monthly_fee ||
                                    student.fee_amount ||
                                    student.fees ||
                                    student.amount ||
                                    0
                                ),

                            paid_amount: 0

                        };

                    }
                );

        }


        await loadFeeRecords();

    }
    catch (error) {

        console.error(error);


        document.getElementById(
            "feesTableBody"
        ).innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    Error loading students.

                    <br><br>

                    ${escapeHtml(
                        error.message || ""
                    )}

                </td>

            </tr>

        `;

    }

}


// =====================================================
// LOAD FEE RECORDS
// =====================================================

async function loadFeeRecords() {

    if (!allStudents.length) {

        renderTable();

        return;

    }


    try {

        let fees = [];


        if (currentMode === "owner") {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("fees")
                    .select("*")
                    .eq(
                        "owner_id",
                        user.id
                    );


            if (error)
                throw error;


            fees = data || [];

        }
        else {

            /*
             * Staff uses same owner fee records
             * through RPC if available.
             */

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "staff_get_fees",
                    {
                        p_staff_id:
                            staffInfo.id
                    }
                );


            if (!error && data) {

                fees = data || [];

            }

        }


        const feeMap = {};


        fees.forEach(
            fee => {

                feeMap[
                    String(
                        fee.student_id
                    )
                ] = fee;

            }
        );


        allStudents =
            allStudents.map(
                student => {

                    const fee =
                        feeMap[
                            String(
                                student.id
                            )
                        ];


                    if (fee) {

                        return {

                            ...student,

                            fee_id:
                                fee.id,

                            monthly_fee:
                                Number(
                                    fee.amount ||
                                    student.monthly_fee ||
                                    0
                                ),

                            paid_amount:
                                Number(
                                    fee.paid_amount ||
                                    0
                                ),

                            status:
                                fee.status ||
                                "unpaid"

                        };

                    }


                    return {

                        ...student,

                        fee_id: null,

                        paid_amount: 0,

                        status: "unpaid"

                    };

                }
            );


        renderTable();

    }
    catch (error) {

        console.error(error);

        document.getElementById(
            "feesTableBody"
        ).innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    Error loading fees.

                    <br><br>

                    ${escapeHtml(
                        error.message || ""
                    )}

                </td>

            </tr>

        `;

    }

}


// =====================================================
// RENDER TABLE
// =====================================================

function renderTable() {

    const tbody =
        document.getElementById(
            "feesTableBody"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const batch =
        document.getElementById(
            "batchFilter"
        ).value;


    const rows =
        allStudents.filter(
            student => {

                const name =
                    String(
                        student.full_name ||
                        ""
                    ).toLowerCase();


                const searchOK =
                    !search ||
                    name.includes(search);


                const batchOK =
                    !batch ||
                    String(
                        student.batch || ""
                    ) ===
                    String(batch);


                return searchOK &&
                       batchOK;

            }
        );


    document.getElementById(
        "totalStudents"
    ).textContent =
        rows.length;


    const totalFees =
        rows.reduce(
            (
                total,
                student
            ) => {

                return total +
                    Number(
                        student.monthly_fee ||
                        0
                    );

            },
            0
        );


    const totalReceived =
        rows.reduce(
            (
                total,
                student
            ) => {

                return total +
                    Number(
                        student.paid_amount ||
                        0
                    );

            },
            0
        );


    document.getElementById(
        "totalFees"
    ).textContent =
        money(totalFees);


    document.getElementById(
        "totalReceived"
    ).textContent =
        money(totalReceived);


    if (!rows.length) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    No students found.

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML = "";


    rows.forEach(
        student => {

            const fee =
                Number(
                    student.monthly_fee ||
                    0
                );


            const paid =
                Number(
                    student.paid_amount ||
                    0
                );


            const balance =
                Math.max(
                    fee - paid,
                    0
                );


            let status =
                "unpaid";


            if (
                paid >= fee &&
                fee > 0
            ) {

                status =
                    "paid";

            }
            else if (
                paid > 0
            ) {

                status =
                    "partial";

            }


            let statusText =
                "Unpaid";


            if (status === "paid")
                statusText = "Paid";


            if (status === "partial")
                statusText = "Partial";


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>

                    <strong>
                        ${escapeHtml(
                            student.full_name
                        )}
                    </strong>

                </td>


                <td>
                    ${escapeHtml(
                        student.batch
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        student.instrument
                    )}
                </td>


                <td>
                    ${money(fee)}
                </td>


                <td>
                    ${money(paid)}
                </td>


                <td>
                    ${money(balance)}
                </td>


                <td
                    class="${status}">

                    ${statusText}

                </td>


                <td>

                    <button
                        class="btn pay-btn"
                        onclick="openPayment('${student.id}')">

                        Pay

                    </button>


                    <button
                        class="btn history-btn"
                        onclick="openHistory('${student.id}')">

                        History

                    </button>


                    <button
                        class="btn receipt-btn"
                        onclick="openReceipt('${student.id}')">

                        Receipt

                    </button>

                </td>

            `;


            tbody.appendChild(tr);

        }
    );

}


// =====================================================
// OPEN PAYMENT
// =====================================================

function openPayment(studentId) {

    selectedStudent =
        allStudents.find(
            student =>
                String(
                    student.id
                ) ===
                String(studentId)
        );


    if (!selectedStudent) {

        alert(
            "Student not found."
        );

        return;

    }


    document.getElementById(
        "paymentStudent"
    ).textContent =
        selectedStudent.full_name;


    document.getElementById(
        "paymentAmount"
    ).value = "";


    document.getElementById(
        "paymentDate"
    ).value =
        todayInput();


    document.getElementById(
        "paymentMode"
    ).value = "";


    document.getElementById(
        "paymentModal"
    ).style.display =
        "flex";

}


// =====================================================
// CLOSE PAYMENT
// =====================================================

function closePayment() {

    document.getElementById(
        "paymentModal"
    ).style.display =
        "none";


    selectedStudent =
        null;

}


// =====================================================
// SAVE PAYMENT
// =====================================================

async function savePayment() {

    if (!selectedStudent) {

        alert(
            "Student not selected."
        );

        return;

    }


    const amount =
        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        );


    const date =
        document.getElementById(
            "paymentDate"
        ).value;


    const mode =
        document.getElementById(
            "paymentMode"
        ).value;


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Please enter payment amount."
        );

        return;

    }


    if (!date) {

        alert(
            "Please select payment date."
        );

        return;

    }


    if (!mode) {

        alert(
            "Please select payment mode."
        );

        return;

    }


    try {

        let feeId =
            selectedStudent.fee_id;


        // =================================================
        // CREATE FEE RECORD IF NOT EXIST
        // =================================================

        if (!feeId) {

            if (currentMode === "owner") {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("fees")
                        .insert({

                            owner_id:
                                user.id,

                            student_id:
                                selectedStudent.id,

                            amount:
                                Number(
                                    selectedStudent.monthly_fee ||
                                    0
                                ),

                            paid_amount:
                                0,

                            status:
                                "unpaid"

                        })
                        .select()
                        .single();


                if (error)
                    throw error;


                feeId =
                    data.id;


                selectedStudent.fee_id =
                    feeId;

            }
            else {

                alert(
                    "Fee record not found for this student."
                );

                return;

            }

        }


        // =================================================
        // OWNER PAYMENT
        // =================================================

        if (
            currentMode ===
            "owner"
        ) {

            const {
                error
            } =
                await supabaseClient
                    .from(
                        "fee_payments"
                    )
                    .insert({

                        owner_id:
                            user.id,

                        fee_id:
                            feeId,

                        student_id:
                            selectedStudent.id,

                        amount:
                            amount,

                        payment_date:
                            date +
                            "T12:00:00",

                        payment_mode:
                            mode

                    });


            if (error)
                throw error;

        }


        // =================================================
        // STAFF PAYMENT
        // =================================================

        else {

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "staff_make_fee_payment",
                    {

                        p_staff_id:
                            staffInfo.id,

                        p_student_id:
                            selectedStudent.id,

                        p_amount:
                            amount,

                        p_payment_date:
                            date +
                            "T12:00:00",

                        p_payment_mode:
                            mode

                    }
                );


            if (error)
                throw error;


            if (
                data &&
                data.success === false
            ) {

                throw new Error(
                    data.message ||
                    "Payment failed."
                );

            }

        }


        alert(
            "Payment saved successfully!"
        );


        closePayment();


        await loadStudents();

    }
    catch (error) {

        console.error(
            "Payment Error:",
            error
        );


        alert(
            "Payment failed:\n\n" +
            (
                error.message ||
                error
            )
        );

    }

}


// =====================================================
// HISTORY
// =====================================================

async function openHistory(
    studentId
) {

    const student =
        allStudents.find(
            item =>
                String(
                    item.id
                ) ===
                String(studentId)
        );


    if (!student) {

        alert(
            "Student not found."
        );

        return;

    }


    document.getElementById(
        "historyStudent"
    ).textContent =
        student.full_name;


    document.getElementById(
        "historyContent"
    ).innerHTML =
        "Loading...";


    document.getElementById(
        "historyModal"
    ).style.display =
        "flex";


    try {

        let payments = [];


        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "fee_payments"
                )
                .select("*")
                .eq(
                    "student_id",
                    student.id
                )
                .order(
                    "payment_date",
                    {
                        ascending:
                            false
                    }
                );


        if (error)
            throw error;


        payments =
            data || [];


        renderHistory(
            payments
        );

    }
    catch (error) {

        console.error(error);


        document.getElementById(
            "historyContent"
        ).innerHTML = `

            <div class="empty">

                Unable to load payment history.

                <br><br>

                ${escapeHtml(
                    error.message || ""
                )}

            </div>

        `;

    }

}


// =====================================================
// RENDER HISTORY
// =====================================================

function renderHistory(
    payments
) {

    const box =
        document.getElementById(
            "historyContent"
        );


    if (!payments.length) {

        box.innerHTML = `

            <div class="empty">

                No payment history found.

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    payments.forEach(
        payment => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <strong>
                    ${money(
                        payment.amount
                    )}
                </strong>

                <br><br>

                📅 Payment Date:
                ${escapeHtml(
                    formatDate(
                        payment.payment_date
                    )
                )}

                <br>

                💳 Payment Mode:
                <strong>
                    ${escapeHtml(
                        payment.payment_mode ||
                        "Other"
                    )}
                </strong>

            `;


            box.appendChild(
                div
            );

        }
    );

}


// =====================================================
// CLOSE HISTORY
// =====================================================

function closeHistory() {

    document.getElementById(
        "historyModal"
    ).style.display =
        "none";

}

// =====================================================
// TODAY
// =====================================================

function todayInput() {

    const d =
        new Date();


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


// =====================================================
// MONEY
// =====================================================

function money(value) {

    return "₹" +
        Number(
            value || 0
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    0,

                maximumFractionDigits:
                    2
            }
        );

}


// =====================================================
// DATE
// =====================================================

function formatDate(
    value
) {

    if (!value)
        return "-";


    const d =
        new Date(value);


    if (
        isNaN(
            d.getTime()
        )
    )
        return "-";


    return d.toLocaleDateString(
        "en-IN",
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric"
        }
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// CLOSE MODAL BY CLICKING OUTSIDE
// =====================================================

window.addEventListener(
    "click",
    function(event) {

        const paymentModal =
            document.getElementById(
                "paymentModal"
            );


        const historyModal =
            document.getElementById(
                "historyModal"
            );


        if (
            event.target ===
            paymentModal
        ) {

            closePayment();

        }


        if (
            event.target ===
            historyModal
        ) {

            closeHistory();

        }

    }
);

</script>
